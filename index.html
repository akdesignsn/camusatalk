  function presenterPhoto(name){
    var n = String(name||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    for(var i=0;i<PRESENTER_PHOTOS.length;i++){
      var p = PRESENTER_PHOTOS[i];
      if(new RegExp("\\b"+p.first+"\\b").test(n) && p.last.test(n)) return p.src;
    }
    return "";
  }
  function presenterInitials(name){
    var parts = String(name||"").trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return "?";
    return (parts[0].charAt(0)+(parts.length>1?parts[parts.length-1].charAt(0):"")).toUpperCase();
  }
  // Présentations d'une session : pour la prochaine session, tous les sujets
  // « Présentation programmée » ; pour toute session, les sujets dont la date
  // souhaitée est le jour de la session.
  function presentationsForSession(s){
    var next = nextUpcomingSession();
    var isNext = !!next && String(next.id)===String(s.id);
    var day = (s.sessionDatetime||"").slice(0,10);
    return state.items.filter(function(it){
      if(it.status!=="programmee" && it.status!=="realisee") return false;
      if(isNext && it.status==="programmee") return true;
      return !!day && String(it.desiredDate||"").slice(0,10)===day;
    }).sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); });
  }
  function renderSessionPresentations(s){
    var list = presentationsForSession(s);
    if(!list.length) return "";
    return '<div class="section-head" style="margin-bottom:16px">'+
        '<span class="kicker">Au programme</span>'+
        '<h3 style="margin:0;font-size:18px">Les présentations</h3>'+
      '</div>'+
      '<div class="pres-grid">'+
      list.map(function(it,idx){
        var th = themeById(it.theme);
        var src = presenterPhoto(it.presenterName);
        var avatar = src
          ? '<img class="pres-photo" src="'+src+'" alt="Photo de '+esc(it.presenterName||"")+'">'
          : '<div class="pres-photo pres-initials" aria-hidden="true">'+esc(presenterInitials(it.presenterName))+'</div>';
        return '<div class="pres-card" data-detail="'+esc(it.id)+'" role="button" tabindex="0" aria-label="Voir le détail de '+esc(it.title)+'">'+
          '<div class="pres-num">'+(idx+1)+'</div>'+
          avatar+
          '<div class="pres-who">'+esc(it.presenterName||"")+'</div>'+
          (it.presenterRole ? '<div class="pres-role">'+esc(it.presenterRole)+'</div>' : '')+
          '<span class="theme-tag"><span class="dot" style="background:'+th.color+'"></span>'+esc(th.label)+'</span>'+
          '<h4>'+esc(it.title)+'</h4>'+
          '<div class="pres-meta">'+(it.duration?ICONS.clock+' '+esc(it.duration):'')+(it.mentorName?(it.duration?' · ':'')+'mentor '+esc(it.mentorName):'')+'</div>'+
        '</div>';
      }).join("")+
      '</div>';
  }

  function renderSessionDetail(id){
    var s = state.sessions.find(function(x){ return String(x.id)===String(id); });
    if(!s){
      return '<section class="wrap"><div class="empty-state">'+ICONS.empty+'<div>Cette session est introuvable ou a été supprimée.</div>'+
        '<button type="button" class="btn btn-outline-navy" data-nav="#/sessions" style="margin-top:18px">← Retour aux sessions</button>'+
      '</div></section>';
    }
    var roles = s.roles || emptySessionRoles();
    return '<section class="wrap">'+
      '<button type="button" class="btn btn-ghost btn-sm" data-nav="#/sessions" style="margin-bottom:18px;padding-left:0">← Retour aux sessions</button>'+
      '<div class="toolbar" style="margin-bottom:22px">'+
        '<div class="section-head" style="margin:0">'+
          '<span class="kicker">Session #'+esc(s.sessionNumber||"—")+'</span>'+
          '<h2 style="margin-bottom:0">'+esc(s.name||"Session sans nom")+'</h2>'+
        '</div>'+
        (state.adminUnlocked ? '<div style="display:flex;gap:10px">'+
          '<button type="button" class="btn btn-outline-navy btn-sm" id="btnEditSession">'+ICONS.edit+' Modifier</button>'+
          '<button type="button" class="icon-btn btn-delete-session'+(isSessionDeleteArmed(s.id)?" confirm":"")+'" data-id="'+esc(s.id)+'" title="'+(isSessionDeleteArmed(s.id)?"Cliquer à nouveau pour confirmer la suppression":"Supprimer cette session")+'">'+ICONS.trash+'</button>'+
        '</div>' : '')+
      '</div>'+
      '<div class="form-card" style="margin-bottom:30px">'+
        '<div class="detail-grid">'+
          '<div class="detail-item"><span class="dt-label">Date et heure</span><span class="dt-value">'+fmtSessionDateTime(s.sessionDatetime)+'</span></div>'+
          '<div class="detail-item"><span class="dt-label">Lieu</span><span class="dt-value">'+esc(s.location||"—")+'</span></div>'+
          '<div class="detail-item"><span class="dt-label">Lien Microsoft Teams</span><span class="dt-value">'+(s.teamsLink ? '<a href="'+esc(s.teamsLink)+'" target="_blank" rel="noopener">'+esc(s.teamsLink)+'</a>' : "—")+'</span></div>'+
        '</div>'+
        (s.description ? '<div class="detail-block"><h4>Description</h4><p>'+esc(s.description)+'</p></div>' : '')+
      '</div>'+
      renderSessionPhotosBlock(s)+
      renderSessionPresentations(s)+
      '<div class="section-head" style="margin-bottom:16px">'+
        '<span class="kicker">Organisation</span>'+
        '<h3 style="margin:0;font-size:18px">Rôles de la session</h3>'+
      '</div>'+
      '<div class="roles-list">'+
        SESSION_ROLES.map(function(r){ return renderRoleRow(s, r, roles); }).join("")+
      '</div>'+
      renderMesMissions(s, roles)+
      (state.adminUnlocked ? renderFicheAdminSection(s) : "")+
      renderSessionPosterBlock(s)+
    '</section>';
  }

  /* ============================= MES MISSIONS (fiches numériques) ============================= */
  // Sans compte (comme tout le reste de l'app) : la personne indique son nom,
  // on le compare aux noms déjà assignés dans les rôles de CETTE session, et
  // on affiche uniquement les rôles — parmi ceux qui ont une fiche numérique —
  // qui lui sont attribués.
  // Tous les rôles avec fiche numérique sont affichés directement (pas de
  // filtrage par nom ici : l'assignation change à chaque session, et la
  // personne renseigne de toute façon son nom au moment de remplir sa
  // fiche — voir renderFicheNameGate). Un clic sur un rôle suffit pour
  // commencer.
  function renderMesMissions(s, roles){
    var ficheRoles = [];
    SESSION_ROLES.forEach(function(r){
      var unlocks = FICHE_UNLOCKS_BY_SESSION_ROLE[r.id];
      if(!unlocks) return;
      unlocks.forEach(function(fk){ if(ficheRoles.indexOf(fk)===-1) ficheRoles.push(fk); });
    });
    // Le Mentor n'est pas rattaché à cette session en base (voir plus haut) :
    // le chip navigue vers une liste de toutes les propositions à mentorer,
    // au lieu d'une fiche unique pour cette session.
    ficheRoles.push("mentor");
    // Le Guest n'est pas non plus un rôle de SESSION_ROLES : n'importe quel
    // participant (assigné à un rôle ou simple invité) peut donner son avis
    // sur la session, d'où son ajout systématique ici, comme pour le Mentor.
    ficheRoles.push("guest");
    return '<div class="section-head" style="margin:30px 0 16px">'+
        '<span class="kicker">Mes missions</span>'+
        '<h3 style="margin:0;font-size:18px">Remplir ma fiche</h3>'+
      '</div>'+
      '<div class="form-card mission-card">'+
        '<p style="margin:0 0 14px;font-size:13px;color:var(--text-soft)">Cliquez sur votre rôle pour remplir votre fiche d\'observation — ou sur « Guest » si vous souhaitez simplement partager votre avis sur la session.</p>'+
        '<div class="mission-chips">'+
          ficheRoles.map(function(fk){
            return '<button type="button" class="mission-chip" data-mission-open="'+esc(fk)+'">'+ICONS.file+' '+esc(FICHE_TEMPLATES[fk].label)+'</button>';
          }).join("")+
        '</div>'+
      '</div>';
  }

  /* ============================= FICHES — VUE ADMINISTRATEUR (par session) ============================= */
  function renderFicheAdminSection(s){
    var list = fichesForSessionAdmin(s.id);
    return '<div class="section-head" style="margin:30px 0 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap">'+
        '<div><span class="kicker">Administration</span>'+
        '<h3 style="margin:0;font-size:18px">Fiches de la session</h3></div>'+
        (list.length ? '<button type="button" class="btn btn-outline-navy btn-sm" data-export-session-fiches="'+esc(s.id)+'">'+ICONS.download+' Exporter en PDF</button>' : '')+
      '</div>'+
      (list.length ?
        '<div class="table-wrap">'+
          '<table><thead><tr><th>Participant</th><th>Rôle</th><th>Intervenant(e)</th><th>Statut</th><th>Dernière modification</th><th></th></tr></thead><tbody>'+
            list.map(function(f){
              var tpl = FICHE_TEMPLATES[f.roleKey];
              var st = ficheStatusById(f.status);
              return '<tr>'+
                '<td>'+esc(f.participantName||"—")+'</td>'+
                '<td>'+esc(tpl?tpl.label:f.roleKey)+'</td>'+
                '<td>'+esc(f.intervenantName||"—")+'</td>'+
                '<td><span class="pill '+st.pill+'">'+esc(st.label)+'</span></td>'+
                '<td class="cell-sub">'+fmtDateTimeShort(f.updatedAt||f.createdAt)+'</td>'+
                '<td style="display:flex;gap:6px;justify-content:flex-end">'+
                  '<button type="button" class="btn btn-ghost btn-sm" data-fiche-admin-view="'+esc(f.id)+'">'+ICONS.eye+' Consulter</button>'+
                  '<button type="button" class="icon-btn'+(isFicheDeleteArmed(f.id)?" confirm":"")+'" data-fiche-admin-delete="'+esc(f.id)+'" title="'+(isFicheDeleteArmed(f.id)?"Cliquer à nouveau pour confirmer la suppression":"Supprimer cette fiche")+'">'+ICONS.trash+'</button>'+
                '</td>'+
              '</tr>';
            }).join("")+
          '</tbody></table>'+
        '</div>'
        : '<div class="empty-state">'+ICONS.empty+'<div>Aucune fiche remplie pour cette session pour le moment.</div></div>')+
    '';
  }

  // Modale de lecture seule (administrateur) : mêmes champs que l'éditeur,
  // mais sans possibilité de modification — pratique aussi pour retrouver les
  // fiches d'anciennes sessions (archives).
  function openFicheAdminViewModal(id){
    var f = ficheById(id);
    if(!f) return;

    if(!tpl) return;

            '<span class="theme-tag">'+ICONS.file+' '+esc(tpl.label)+'</span>'+
            '<h3 class="modal-title">'+esc(f.participantName||"—")+(f.intervenantName?' → '+esc(f.intervenantName):'')+'</h3>'+
          '</div>'+
          '<button type="button" class="modal-close" data-modal-close aria-label="Fermer">'+ICONS.close+'</button>'+
        '</div>'+
        '<div class="modal-body">'+
          '<div class="card-foot" style="border-top:none;padding-top:0;margin-top:14px">'+
            '<span class="pill '+st.pill+'">'+esc(st.label)+'</span>'+
            '<span style="font-size:12.5px;color:var(--text-soft)">Dernière modification '+fmtDateTimeShort(f.updatedAt||f.createdAt)+'</span>'+
          '</div>'+

  // "Origine" d'une fiche pour le compte rendu PDF : nom de la session (avec
  // sa date) pour une fiche liée à une session, ou titre de la proposition
  // pour une fiche Mentor.
  function ficheExportSourceLabel(f){
    if(f.propositionId){
      var p = state.items.find(function(x){ return String(x.id)===String(f.propositionId); });
      return p ? ("Proposition — "+p.title) : "Proposition";
    }
    var s = state.sessions.find(function(x){ return String(x.id)===String(f.sessionId); });
    if(!s) return "—";
    var label = s.name || ("Session #"+(s.sessionNumber||"—"));
    return s.sessionDatetime ? (label+" — "+fmtSessionDateTime(s.sessionDatetime)) : label;
  }

  // Construit le HTML complet du compte rendu (page de garde + une fiche par
  // bloc, réutilisant le même moteur de rendu en lecture seule que la modale
  // "Consulter" de l'admin — voir openFicheAdminViewModal).
  function buildFicheExportHtml(list, contextLabel){
    var now = new Date();
    var generatedAt = now.toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"})+" à "+now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    var cover = '<div class="fiche-export-cover">'+
        '<h1>CAMUSAT TALK — Compte rendu des fiches</h1>'+
        '<p>'+esc(contextLabel)+'</p>'+
        '<p>'+list.length+' fiche'+(list.length>1?'s':'')+' — généré le '+esc(generatedAt)+'</p>'+
      '</div>';
    var items = list.map(function(f){
      var tpl = FICHE_TEMPLATES[f.roleKey];
      if(!tpl) return "";
      var st = ficheStatusById(f.status);
      var metaParts = [["Origine", ficheExportSourceLabel(f)], ["Rempli par", f.participantName||"—"]];
      if(f.intervenantName) metaParts.push(["Intervenant(e) observé(e)", f.intervenantName]);
      metaParts.push(["Statut", st.label]);
      metaParts.push(["Dernière modification", fmtDateTimeShort(f.updatedAt||f.createdAt)]);
      return '<div class="fiche-export-item">'+
          '<h2>'+ICONS.file+' '+esc(tpl.label)+'</h2>'+
          '<div class="fe-meta">'+metaParts.map(function(mp){ return '<span><b>'+esc(mp[0])+' :</b> '+esc(mp[1])+'</span>'; }).join("")+'</div>'+
          '<fieldset disabled>'+renderFicheFields(tpl, f.formData||{})+'</fieldset>'+
        '</div>';
    }).join("");
    return cover + items;
  }

  // Déclenche l'impression / "Enregistrer en PDF" du compte rendu pour la
  // liste de fiches donnée (déjà filtrée par l'appelant). Le contenu est
  // injecté dans #ficheExportPrintRoot, qui devient seul visible le temps de
  // l'impression grâce à la classe "exporting-fiches" sur <body> (voir CSS) ;
  // "afterprint" nettoie tout, y compris si l'utilisateur annule la boîte de
  // dialogue d'impression.
  function exportFichesToPdf(list, contextLabel){
    if(!list || !list.length){ toast("Aucune fiche à exporter", "Aucune fiche ne correspond à ce filtre pour le moment.", true); return; }
    var root = document.getElementById("ficheExportPrintRoot");
    if(!root) return;
    root.innerHTML = buildFicheExportHtml(list, contextLabel);
    document.body.classList.add("exporting-fiches");
    setTimeout(function(){ window.print(); }, 80);
  }
  window.addEventListener("afterprint", function(){
    document.body.classList.remove("exporting-fiches");
    var root = document.getElementById("ficheExportPrintRoot");
    if(root) root.innerHTML = "";
  });

  /* ============================= FICHES — MOTEUR DE FORMULAIRE GÉNÉRIQUE ============================= */
  // Un seul moteur (lecture ET écriture) pilote les 5 fiches à partir de
  // FICHE_TEMPLATES : pas de HTML dédié par fiche, seulement des types de
  // champ réutilisables (voir commentaire au-dessus de FICHE_TEMPLATES).
  function cloneJson(o){ return JSON.parse(JSON.stringify(o||{})); }

  function renderFicheFields(tpl, formData){
    var html = "";
    if(tpl.intro){
      html += '<div class="fiche-intro">'+tpl.intro.map(function(block){
        var inner = '<h5>'+esc(block.h)+'</h5>';
        if(block.p) inner += '<p>'+esc(block.p)+'</p>';
        if(block.ul) inner += '<ul>'+block.ul.map(function(li){ return '<li>'+esc(li)+'</li>'; }).join("")+'</ul>';
        // Même conteneur .table-wrap (overflow-x:auto) que les autres tableaux
        // de fiche : un tableau HTML en layout "auto" peut rester plus large
        // que son conteneur même quand le texte pourrait normalement passer à
        // la ligne (sur mobile notamment) — .table-wrap absorbe ça par un
        // défilement horizontal contenu, plutôt que de faire déborder la page.
        if(block.table) inner += '<div class="table-wrap" style="background:none;border:none;box-shadow:none"><table class="mini-info-table"><tbody>'+block.table.map(function(row){ return '<tr><td>'+row[0]+'</td><td>'+esc(row[1])+'</td></tr>'; }).join("")+'</tbody></table></div>';
        return '<div class="fiche-intro-block">'+inner+'</div>';
      }).join("")+'</div>';
    }
    tpl.sections.forEach(function(sec){
      html += '<div class="fiche-section"><h4>'+esc(sec.title)+'</h4>'+
        sec.fields.map(function(f){ return renderFicheField(f, formData); }).join("")+
      '</div>';
    });
    return html;
  }

  function renderFicheField(f, formData){
    var val = formData[f.key];
    if(f.type==="text"){
      return '<div class="field"><label>'+esc(f.label||"")+'</label><input type="text" data-fk="'+f.key+'" placeholder="'+esc(f.placeholder||"")+'" value="'+esc(val||"")+'"></div>';
    }
    if(f.type==="textarea"){
      return '<div class="field">'+(f.label?'<label>'+esc(f.label)+'</label>':'')+'<textarea data-fk="'+f.key+'" rows="'+(f.rows||3)+'">'+esc(val||"")+'</textarea></div>';
    }
    if(f.type==="radio"){
      return '<div class="field">'+(f.label?'<label>'+esc(f.label)+'</label>':'')+
        '<div class="radio-row">'+f.options.map(function(o){
          return '<label class="radio-opt"><input type="radio" name="fk_'+f.key+'" data-fk-radio="'+f.key+'" value="'+o.value+'"'+(val===o.value?" checked":"")+'> '+esc(o.label)+'</label>';
        }).join("")+'</div></div>';
    }
    if(f.type==="checkbox_group"){
      var selected = Array.isArray(val) ? val : [];
      var otherVal = formData[f.otherKey]||"";
      return '<div class="field"><div class="checkbox-row">'+
        f.options.map(function(o){
          return '<label class="chk-opt"><input type="checkbox" data-fk-check="'+f.key+'" value="'+o.value+'"'+(selected.indexOf(o.value)>-1?" checked":"")+'> '+esc(o.label)+'</label>';
        }).join("")+
        (f.allowOther ? '<label class="chk-opt chk-opt-other">Autre <input type="text" data-fk="'+f.otherKey+'" value="'+esc(otherVal)+'"></label>' : '')+
        '</div></div>';
    }
    // notes_table, checklist_table, rating_table, repeatable_table : chaque
    // ligne devient une "rubrique" (carte) autonome — plus de tableau HTML à
    // faire défiler horizontalement, les champs de la ligne s'empilent
    // verticalement (voir .fiche-row-card, plus haut dans le CSS).
    if(f.type==="notes_table"){
      var rowsVal = val||{};
      return '<div class="field"><div class="fiche-row-cards">'+
        f.rows.map(function(r){
          var rv = rowsVal[r.key]||"";
          return '<div class="fiche-row-card">'+
            '<div class="fiche-row-card-head"><h5 class="fiche-row-card-title">'+esc(r.label)+'</h5></div>'+
            '<div class="field"><label>'+esc(f.noteLabel||"Notes")+'</label><textarea data-fk-table="'+f.key+'" data-row="'+r.key+'" rows="2">'+esc(rv)+'</textarea></div>'+
          '</div>';
        }).join("")+
      '</div></div>';
    }
    if(f.type==="checklist_table"){
      var rowsVal2 = val||{};
      return '<div class="field"><div class="fiche-row-cards">'+
        f.rows.map(function(r){
          var rv = rowsVal2[r.key]||{};
          return '<div class="fiche-row-card">'+
            '<div class="fiche-row-card-head">'+
              '<label class="fiche-row-card-check"><input type="checkbox" data-fk-table-check="'+f.key+'" data-row="'+r.key+'"'+(rv.checked?" checked":"")+'> <span class="fiche-row-card-title">'+esc(r.label)+'</span></label>'+
            '</div>'+
            '<div class="field"><label>Observations</label><input type="text" data-fk-table-obs="'+f.key+'" data-row="'+r.key+'" value="'+esc(rv.observation||"")+'"></div>'+
          '</div>';
        }).join("")+
      '</div></div>';
    }
    if(f.type==="rating_table"){
      var rowsVal3 = val||{};
      return '<div class="field"><div class="fiche-row-cards">'+
        f.rows.map(function(r){
          var rv = rowsVal3[r.key]||{};
          return '<div class="fiche-row-card">'+
            '<div class="fiche-row-card-head"><h5 class="fiche-row-card-title">'+esc(r.label)+'</h5></div>'+
            '<div class="field"><div class="radio-row">'+
              f.options.map(function(o){
                return '<label class="radio-opt"><input type="radio" name="fk_'+f.key+'_'+r.key+'" data-fk-table-radio="'+f.key+'" data-row="'+r.key+'" value="'+o.value+'"'+(rv.rating===o.value?" checked":"")+'> '+esc(o.label)+'</label>';
              }).join("")+
            '</div></div>'+
            '<div class="field"><label>Observation</label><input type="text" data-fk-table-obs="'+f.key+'" data-row="'+r.key+'" value="'+esc(rv.observation||"")+'"></div>'+
          '</div>';
        }).join("")+
      '</div></div>';
    }
    if(f.type==="repeatable_table"){
      var rowsArr = Array.isArray(val) ? val.slice() : [];
      while(rowsArr.length < (f.minRows||1)) rowsArr.push({});
      return '<div class="field">'+
        '<div class="fiche-row-cards" data-repeat-body="'+f.key+'">'+
          rowsArr.map(function(row, idx){ return renderRepeatableRow(f, row, idx); }).join("")+
        '</div>'+
        '<button type="button" class="btn btn-ghost btn-sm" data-fiche-add-row="'+f.key+'" style="margin-top:8px">'+ICONS.plus+' '+(f.addLabel||"Ajouter une ligne")+'</button>'+
        '</div>';
    }
    return "";
  }

  function renderRepeatableRow(f, row, idx){
    row = row || {};
    return '<div class="fiche-row-card" data-repeat-row="'+idx+'">'+
      '<div class="fiche-row-card-head"><h5 class="fiche-row-card-title">'+esc(f.rowLabel||"Ligne")+' '+(idx+1)+'</h5>'+
        '<button type="button" class="icon-btn" data-fiche-remove-row="'+idx+'" title="Retirer cette ligne">'+ICONS.close+'</button>'+
      '</div>'+
      f.columns.map(function(c){
        if(c.type==="radio"){
          return '<div class="field"><label>'+esc(c.label)+'</label><div class="radio-row">'+c.options.map(function(o){
            return '<label class="radio-opt"><input type="radio" name="fk_'+f.key+'_'+idx+'_'+c.key+'" data-fk-rep-radio="'+c.key+'" value="'+o.value+'"'+(row[c.key]===o.value?" checked":"")+'> '+esc(o.label)+'</label>';
          }).join(" ")+'</div></div>';
        }
        return '<div class="field"><label>'+esc(c.label)+'</label><input type="text" data-fk-rep="'+c.key+'" placeholder="'+esc(c.placeholder||"")+'" value="'+esc(row[c.key]||"")+'"></div>';
      }).join("")+
    '</div>';
  }

  // Relit le DOM du formulaire (plutôt qu'un FormData générique, pour gérer
  // proprement les groupes de cases à cocher, tableaux et lignes répétables).
  function serializeFicheForm(tpl, root){
    var data = {};
    function collectField(f){
      if(f.type==="text" || f.type==="textarea"){
        var el = root.querySelector('[data-fk="'+f.key+'"]');
        data[f.key] = el ? el.value : "";
      } else if(f.type==="radio"){
        var checked = root.querySelector('[data-fk-radio="'+f.key+'"]:checked');
        data[f.key] = checked ? checked.value : null;
      } else if(f.type==="checkbox_group"){
        var boxes = root.querySelectorAll('[data-fk-check="'+f.key+'"]:checked');
        data[f.key] = Array.prototype.map.call(boxes, function(b){ return b.value; });
        if(f.allowOther){
          var oEl = root.querySelector('[data-fk="'+f.otherKey+'"]');
          data[f.otherKey] = oEl ? oEl.value : "";
        }
      } else if(f.type==="notes_table"){
        var obj = {};
        f.rows.forEach(function(r){
          var ta = root.querySelector('[data-fk-table="'+f.key+'"][data-row="'+r.key+'"]');
          obj[r.key] = ta ? ta.value : "";
        });
        data[f.key] = obj;
      } else if(f.type==="checklist_table"){
        var obj2 = {};
        f.rows.forEach(function(r){
          var chk = root.querySelector('[data-fk-table-check="'+f.key+'"][data-row="'+r.key+'"]');
          var obs = root.querySelector('[data-fk-table-obs="'+f.key+'"][data-row="'+r.key+'"]');
          obj2[r.key] = { checked: chk ? chk.checked : false, observation: obs ? obs.value : "" };
        });
        data[f.key] = obj2;
      } else if(f.type==="rating_table"){
        var obj3 = {};
        f.rows.forEach(function(r){
          var checkedOpt = root.querySelector('[data-fk-table-radio="'+f.key+'"][data-row="'+r.key+'"]:checked');
          var obs2 = root.querySelector('[data-fk-table-obs="'+f.key+'"][data-row="'+r.key+'"]');
          obj3[r.key] = { rating: checkedOpt ? checkedOpt.value : null, observation: obs2 ? obs2.value : "" };
        });
        data[f.key] = obj3;
      } else if(f.type==="repeatable_table"){
        var body = root.querySelector('[data-repeat-body="'+f.key+'"]');
        var rowsArr = [];
        if(body){
          Array.prototype.forEach.call(body.querySelectorAll("[data-repeat-row]"), function(tr){
            var rowObj = {};
            f.columns.forEach(function(c){
              if(c.type==="radio"){
                var rc = tr.querySelector('[data-fk-rep-radio="'+c.key+'"]:checked');
                rowObj[c.key] = rc ? rc.value : null;
              } else {
                var inp = tr.querySelector('[data-fk-rep="'+c.key+'"]');
                rowObj[c.key] = inp ? inp.value : "";
              }
            });
            rowsArr.push(rowObj);
          });
        }
        data[f.key] = rowsArr;
      }
    }
    tpl.sections.forEach(function(sec){ sec.fields.forEach(collectField); });
    return data;
  }

  function fieldFilled(f, val){
    if(f.type==="text" || f.type==="textarea") return !!(val && String(val).trim());
    if(f.type==="radio") return !!val;
    if(f.type==="checkbox_group") return Array.isArray(val) && val.length>0;
    if(f.type==="notes_table") return !!(val && Object.keys(val).some(function(k){ return (val[k]||"").trim(); }));
    if(f.type==="checklist_table") return !!(val && Object.keys(val).some(function(k){ return val[k] && (val[k].checked || (val[k].observation||"").trim()); }));
    if(f.type==="rating_table") return !!(val && Object.keys(val).some(function(k){ return val[k] && (val[k].rating || (val[k].observation||"").trim()); }));
    if(f.type==="repeatable_table") return Array.isArray(val) && val.some(function(row){ return row && Object.keys(row).some(function(k){ return row[k]; }); });
    return false;
  }
  function ficheProgress(tpl, formData){
    var total=0, filled=0;
    tpl.sections.forEach(function(sec){ sec.fields.forEach(function(f){ total++; if(fieldFilled(f, formData[f.key])) filled++; }); });
    return total ? Math.round(filled/total*100) : 0;
  }

  /* ============================= FICHES — ROUTES & PAGES ============================= */
  // Lien court et permanent pour un QR code imprimé une seule fois (voir
  // sessionForGuestQR) : "#/guest" redirige toujours vers une fiche Guest
  // neuve pour la session actuellement pertinente, sans jamais coder l'ID
  // d'une session précise dans le QR code lui-même.
  function renderGuestShortcut(){
    var s = sessionForGuestQR();
    if(!s){
      return '<section class="wrap"><div class="empty-state">'+ICONS.empty+'<div>Aucune session CAMUSAT TALK n\'est encore programmée. Revenez un peu plus tard.</div>'+
        '<button type="button" class="btn btn-outline-navy" data-nav="#/" style="margin-top:18px">← Retour à l\'accueil</button></div></section>';
    }
    setTimeout(function(){ location.hash = "#/fiche/s/"+encodeURIComponent(s.id)+"/guest/new"; }, 0);
    return '<section class="wrap"><div class="empty-state">'+ICONS.empty+'<div>Redirection…</div></div></section>';
  }
  function renderFicheRoute(){
    var info = ficheRouteInfo();
    if(!info){
      return '<section class="wrap"><div class="empty-state">'+ICONS.empty+'<div>Fiche introuvable.</div></div></section>';
    }
    if(info.kind==="mentor-chooser"){
      return renderMentorFicheChooser();
    }
    if(info.kind==="proposition"){
      return renderMentorFicheEditor(info.propositionId);
    }
    var s = state.sessions.find(function(x){ return String(x.id)===String(info.sessionId); });
    if(!s){
      return '<section class="wrap"><div class="empty-state">'+ICONS.empty+'<div>Cette session est introuvable.</div>'+
        '<button type="button" class="btn btn-outline-navy" data-nav="#/sessions" style="margin-top:18px">← Retour aux sessions</button></div></section>';
    }
    var tpl = FICHE_TEMPLATES[info.roleKey];
    if(!tpl){
      return '<section class="wrap"><div class="empty-state">'+ICONS.empty+'<div>Fiche inconnue.</div></div></section>';
    }
    if(info.kind==="session-editor"){
      if(info.ficheId==="new"){
        // Nouvelle fiche vierge (bouton "+ Nouvelle fiche" du chooser) : plus
        // d'étape intermédiaire demandant le nom de l'intervenant(e) — il/elle
        // est désormais un champ de la fiche elle-même, rempli directement là
        // où on remplit le reste de l'observation (voir demande). On garde
        // seulement la porte d'entrée "Votre nom" (qui identifie qui remplit),
        // redemandée ici aussi si elle n'a pas déjà été validée pour ce rôle
        // (ex. arrivée directe par un lien, ou rechargement de la page).
        var newFicheGateKey = info.sessionId+"::"+info.roleKey;
        if(state.ficheGateConfirmedFor !== newFicheGateKey){
          return renderFicheNameGate(s, tpl);
        }
        var freshName = (state.myNameDraft||"").trim();
        if(!freshName){
          return renderFicheNameGate(s, tpl);
        }
        var blankDraft = {id:null, sessionId:s.id, roleKey:info.roleKey, participantName:freshName, intervenantName:"", status:"a_remplir", formData:{}};
        return renderFicheEditorPage(s, tpl, blankDraft, null);
      }
      var fiche = ficheById(info.ficheId);
      if(!fiche){
        return '<section class="wrap"><div class="empty-state">'+ICONS.empty+'<div>Cette fiche est introuvable ou a été supprimée.</div>'+
          '<button type="button" class="btn btn-outline-navy" data-nav="#/fiche/s/'+esc(s.id)+'/'+esc(info.roleKey)+'" style="margin-top:18px">← Retour</button></div></section>';
      }
      return renderFicheEditorPage(s, tpl, fiche, null);
    }
    // info.kind === "session-role" : on clique directement sur son rôle
    // depuis « Mes missions ». On ne demande le nom QUE s'il faut vraiment
    // démarrer une fiche vierge — jamais juste pour consulter ce qui existe
    // déjà : pour un rôle à liste (Grammarian, Évaluateur, Posture
    // Visualizer), on va donc directement au chooser, qui montre toutes les
    // fiches déjà remplies ; la porte d'entrée n'apparaît qu'au clic sur
    // "+ Nouvelle fiche" (voir plus haut, info.ficheId==="new"). Pour le
    // Timekeeper (une seule fiche par session), s'il en existe déjà une, on
    // l'ouvre directement ; sinon on demande le nom avant de la créer.
    if(FICHE_SCOPE[info.roleKey]==="session"){
      var existingTk = singleFicheForRole(s.id, info.roleKey);
      if(existingTk){
        return renderFicheEditorPage(s, tpl, existingTk, null);
      }
      var ficheGateKey = info.sessionId+"::"+info.roleKey;
      if(state.ficheGateConfirmedFor !== ficheGateKey){
        return renderFicheNameGate(s, tpl);
      }
      var trimmed = (state.myNameDraft!==null ? state.myNameDraft : "").trim();
      if(!trimmed){
        return renderFicheNameGate(s, tpl);
      }
      var draft = {id:null, sessionId:s.id, roleKey:info.roleKey, participantName:trimmed, intervenantName:null, status:"a_remplir", formData:{}};
      return renderFicheEditorPage(s, tpl, draft, null);
    }
    return renderFicheChooser(s, info.roleKey);
  }

  function backHashFor(fiche){
    if(fiche.propositionId) return "#/presentateurs";
    var scope = FICHE_SCOPE[fiche.roleKey];
    if(scope==="session_intervenant" || scope==="session_multi") return "#/fiche/s/"+encodeURIComponent(fiche.sessionId)+"/"+encodeURIComponent(fiche.roleKey);
    return "#/sessions/"+encodeURIComponent(fiche.sessionId);
  }

  function renderFicheEditorPage(s, tpl, fiche, proposition){
    var draftKey = fiche.id || ("new:"+(fiche.sessionId||fiche.propositionId)+":"+fiche.roleKey+":"+(fiche.intervenantName||""));
    var dataSource = (state.ficheDraft && state.ficheDraft.key===draftKey) ? state.ficheDraft.data : cloneJson(fiche.formData||{});
    state.ficheDraft = { key: draftKey, fiche: fiche, data: dataSource, tpl: tpl, session: s, proposition: proposition };

    var progress = ficheProgress(tpl, dataSource);
    var st = ficheStatusById(fiche.status||"a_remplir");
    var locked = fiche.status==="termine";

    // Pour les rôles "session_intervenant" (Grammarian, Évaluateur, Posture
    // Visualizer), l'intervenant(e) observé(e) n'est plus demandé en amont
    // (ancien champ sur le chooser) : c'est un champ ordinaire de la fiche
    // elle-même (voir needsIntervenantField plus bas), rempli en même temps
    // que le reste de l'observation — donc pas de doublon dans ce bloc méta.
    var needsIntervenantField = FICHE_SCOPE[fiche.roleKey]==="session_intervenant";

    var metaItems = [];
    if(s) metaItems.push(["Session", esc(s.name||"—")+' <span class="dt-value-sub">('+fmtSessionDateTime(s.sessionDatetime)+')</span>']);
    if(proposition) metaItems.push(["Proposition", esc(proposition.title||"—")]);
    metaItems.push([tpl.label, esc(fiche.participantName||"—")]);
    if(fiche.roleKey==="mentor") metaItems.push(["Présentateur / Présentatrice", esc(fiche.intervenantName||"—")]);

    return '<section class="wrap fiche-editor-page">'+
      '<button type="button" class="btn btn-ghost btn-sm" id="btnFicheBack" data-back-hash="'+esc(backHashFor(fiche))+'" style="margin-bottom:18px;padding-left:0">← Retour</button>'+
      '<div class="toolbar" style="margin-bottom:18px;align-items:flex-start">'+
        '<div class="section-head" style="margin:0">'+
          '<span class="kicker">'+esc(tpl.label)+'</span>'+
          '<h2 style="margin-bottom:4px">'+esc(tpl.subtitle||tpl.label)+'</h2>'+
        '</div>'+
        '<span class="pill '+st.pill+'" style="margin-top:4px">'+esc(st.label)+'</span>'+
      '</div>'+
      '<div class="form-card" style="margin-bottom:22px">'+
        '<div class="detail-grid">'+
          metaItems.map(function(m){ return '<div class="detail-item"><span class="dt-label">'+esc(m[0])+'</span><span class="dt-value">'+m[1]+'</span></div>'; }).join("")+
        '</div>'+
      '</div>'+
      '<div class="fiche-progress-wrap">'+
        '<div class="fiche-progress-bar"><div class="fiche-progress-fill" style="width:'+progress+'%"></div></div>'+
        '<span class="fiche-progress-label">'+progress+'% complété'+(fiche.updatedAt||fiche.createdAt ? ' · Dernière sauvegarde '+fmtDateTimeShort(fiche.updatedAt||fiche.createdAt) : '')+'</span>'+
      '</div>'+
      '<form id="ficheFormRoot"'+(locked?' data-locked="1"':'')+'>'+
        '<fieldset'+(locked?' disabled':'')+' style="border:none;padding:0;margin:0">'+
          (needsIntervenantField ?
            '<div class="field" style="margin-bottom:22px;max-width:420px">'+
              '<label for="ficheIntervenantInput">Intervenant(e) observé(e)</label>'+
              '<input type="text" id="ficheIntervenantInput" placeholder="Nom et prénom" autocomplete="off" value="'+esc(fiche.intervenantName||"")+'">'+
            '</div>'
            : '')+
          renderFicheFields(tpl, dataSource)+
        '</fieldset>'+
      '</form>'+
      (locked ?
        '<div class="fiche-locked-note">'+ICONS.check+' Cette fiche a été validée et envoyée'+(fiche.submittedAt ? ' le '+fmtDateTimeShort(fiche.submittedAt) : '')+'. Elle n\'est plus modifiable.</div>'
        :
        '<div class="fiche-actions">'+
          '<button type="button" class="btn btn-outline-navy" id="btnFicheSaveLater">Enregistrer et continuer plus tard</button>'+
          '<button type="button" class="btn btn-secondary" id="btnFicheSave">Enregistrer</button>'+
          '<button type="button" class="btn btn-primary" id="btnFicheValidate">'+ICONS.check+' Valider ma fiche</button>'+
        '</div>')+
      (fiche.id ?
        '<div style="text-align:right;margin-top:10px">'+
          '<button type="button" class="btn-delete-fiche-self'+(isFicheDeleteArmed(fiche.id)?" confirm":"")+'" data-id="'+esc(fiche.id)+'">'+ICONS.trash+' '+(isFicheDeleteArmed(fiche.id)?"Cliquer à nouveau pour confirmer":"Supprimer cette fiche")+'</button>'+
        '</div>'
        : '')+
    '</section>';
  }

  /* ============================= FICHES — SAUVEGARDE & ÉVÉNEMENTS ============================= */
  function saveFicheDraft(status, thenNavigateBack){
    var d = state.ficheDraft;
    if(!d) return;
    var root = document.getElementById("ficheFormRoot");
    if(!root) return;
    var formData = serializeFicheForm(d.tpl, root);
    d.data = formData;
    // Intervenant(e) observé(e) : champ ordinaire de la fiche (voir
    // needsIntervenantField dans renderFicheEditorPage), pas dans formData —
    // colonne dédiée "intervenant_name", comme avant.
    var intervenantInput = document.getElementById("ficheIntervenantInput");
    if(intervenantInput) d.fiche.intervenantName = intervenantInput.value.trim();

    function afterSaved(mergedFiche){
      d.fiche = mergedFiche;
      toast(status==="termine" ? "Fiche validée" : "Fiche enregistrée", "");
      if(thenNavigateBack) navTo(backHashFor(mergedFiche));
      else render();
    }

    if(d.fiche.id){
      var payload = { formData: formData };
      if(intervenantInput) payload.intervenantName = d.fiche.intervenantName;
      payload.status = status || (d.fiche.status==="termine" ? "termine" : "en_cours");
      if(payload.status==="termine" && !d.fiche.submittedAt) payload.submittedAt = new Date().toISOString();
      updateFiche(d.fiche.id, payload, function(success){
        if(success){
          afterSaved(Object.assign({}, d.fiche, payload, {updatedAt:new Date().toISOString()}));
        }
      });
    } else {
      var createPayload = {
        sessionId: d.fiche.sessionId || null,
        propositionId: d.fiche.propositionId || null,
        roleKey: d.fiche.roleKey,
        participantName: d.fiche.participantName,
        intervenantName: d.fiche.intervenantName || null,
        status: status || "en_cours",
        formData: formData
      };
      if(createPayload.status==="termine") createPayload.submittedAt = new Date().toISOString();
      createFiche(createPayload, function(success, err, created){
        if(!success || !created) return;
        if(FICHE_SCOPE[created.roleKey]==="session_intervenant"){
          // Un identifiant existe désormais : on bascule vers l'URL définitive.
          d.key = created.id;
          d.fiche = created;
          toast(status==="termine" ? "Fiche validée" : "Fiche enregistrée", "");
          if(thenNavigateBack) navTo(backHashFor(created));
          else navTo("#/fiche/s/"+encodeURIComponent(created.sessionId)+"/"+encodeURIComponent(created.roleKey)+"/"+encodeURIComponent(created.id));
          return;
        }
        afterSaved(created);
      });
    }
  }

  // À appeler juste avant tout render() déclenché depuis l'intérieur de
  // l'éditeur de fiche (ajout/retrait de ligne, armement d'une suppression...)
  // pour ne pas perdre ce qui est en cours de saisie dans le champ
  // "Intervenant(e) observé(e)" (un render() régénère tout le HTML depuis
  // state.ficheDraft.fiche, donc tout ce qui n'y est pas déjà recopié serait
  // sinon effacé — même logique que pour serializeFicheForm côté formData).
  function syncFicheIntervenantDraft(){
    var d = state.ficheDraft;
    var el = document.getElementById("ficheIntervenantInput");
    if(d && el) d.fiche.intervenantName = el.value;
  }

  function bindFicheRouteEvents(){
    // Porte d'entrée : on demande le nom seulement ici, au moment de
    // commencer à remplir un rôle (voir renderFicheNameGate).
    var gateInput = document.getElementById("ficheGateNameInput");
    var gateBtn = document.getElementById("btnFicheGateContinue");
    if(gateBtn){
      var submitGate = function(){
        var name = (gateInput ? gateInput.value : "").trim();
        if(!name){ toast("Nom requis", "Indiquez votre nom pour continuer.", true); return; }
        var info = ficheRouteInfo();
        state.myNameDraft = name;
        state.ficheGateConfirmedFor = info ? (info.sessionId+"::"+info.roleKey) : null;
        render();
      };
      gateBtn.addEventListener("click", submitGate);
      if(gateInput){
        gateInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); submitGate(); } });
      }
    }

    // Le chooser n'a plus de champ "intervenant(e)" séparé : le bouton
    // "+ Nouvelle fiche" est un simple data-nav vers .../new, géré par le
    // délégué de clic global (voir renderFicheChooser et renderFicheRoute).

    // Éditeur : ajout / retrait de ligne dans un tableau répétable.
    document.querySelectorAll("[data-fiche-add-row]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-fiche-add-row");
        var root = document.getElementById("ficheFormRoot");
        var d = state.ficheDraft;
        if(!root || !d) return;
        var current = serializeFicheForm(d.tpl, root);
        var arr = Array.isArray(current[key]) ? current[key] : [];
        arr.push({});
        current[key] = arr;
        d.data = current;
        syncFicheIntervenantDraft();
        render();
      });
    });
    document.querySelectorAll("[data-fiche-remove-row]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var tr = btn.closest("[data-repeat-row]");
        var tbody = tr ? tr.closest("[data-repeat-body]") : null;
        var key = tbody ? tbody.getAttribute("data-repeat-body") : null;
        var idx = tr ? parseInt(tr.getAttribute("data-repeat-row"),10) : -1;
        var root = document.getElementById("ficheFormRoot");
        var d = state.ficheDraft;
        if(!root || !d || !key || idx<0) return;
        var current = serializeFicheForm(d.tpl, root);
        var arr = Array.isArray(current[key]) ? current[key] : [];
        arr.splice(idx,1);
        current[key] = arr;
        d.data = current;
        syncFicheIntervenantDraft();
        render();
      });
    });

    // "← Retour" depuis l'éditeur d'une fiche : on enregistre d'abord ce qui
    // a été saisi (comme "Enregistrer et continuer plus tard"), pour ne
    // jamais perdre de données en quittant la fiche — sauf s'il s'agit d'un
    // brouillon tout neuf resté vide, auquel cas on ne crée pas de fiche
    // inutile (voir la création "paresseuse" ailleurs dans ce fichier).
    var btnFicheBack = document.getElementById("btnFicheBack");
    if(btnFicheBack){
      btnFicheBack.addEventListener("click", function(){
        var d = state.ficheDraft;
        var fallbackHash = btnFicheBack.getAttribute("data-back-hash");
        if(!d || d.fiche.status==="termine"){ navTo(fallbackHash); return; }
        var root = document.getElementById("ficheFormRoot");
        var formData = root ? serializeFicheForm(d.tpl, root) : (d.data||{});
        var intervenantInput = document.getElementById("ficheIntervenantInput");
        var intervenantVal = intervenantInput ? intervenantInput.value.trim() : (d.fiche.intervenantName||"");
        var hasContent = !!intervenantVal || (d.tpl.sections||[]).some(function(sec){
          return sec.fields.some(function(f){ return fieldFilled(f, formData[f.key]); });
        });
        if(!d.fiche.id && !hasContent){ navTo(fallbackHash); return; }
        saveFicheDraft(null, true);
      });
    }

    // Éditeur : actions de sauvegarde / validation.
    var btnSave = document.getElementById("btnFicheSave");
    if(btnSave) btnSave.addEventListener("click", function(){ saveFicheDraft(null, false); });
    var btnSaveLater = document.getElementById("btnFicheSaveLater");
    if(btnSaveLater) btnSaveLater.addEventListener("click", function(){ saveFicheDraft(null, true); });
    var btnValidate = document.getElementById("btnFicheValidate");
    if(btnValidate) btnValidate.addEventListener("click", function(){
      if(!window.confirm("Valider définitivement cette fiche ? Elle ne sera plus modifiable ensuite.")) return;
      saveFicheDraft("termine", true);
    });

    // Suppression de la fiche par la personne qui l'a remplie (même logique
    // "cliquer deux fois pour confirmer" que les suppressions admin).
    var btnDeleteSelf = document.querySelector(".btn-delete-fiche-self");
    if(btnDeleteSelf){
      btnDeleteSelf.addEventListener("click", function(){
        var fid = btnDeleteSelf.getAttribute("data-id");
        if(!isFicheDeleteArmed(fid)){
          // On sauvegarde d'abord dans state.ficheDraft ce qui a déjà été
          // saisi dans le formulaire (non encore enregistré), pour ne pas le
          // perdre au re-rendu déclenché par l'armement du bouton.
          var root = document.getElementById("ficheFormRoot");
          if(root && state.ficheDraft){ state.ficheDraft.data = serializeFicheForm(state.ficheDraft.tpl, root); }
          syncFicheIntervenantDraft();
          var armedAt = Date.now() + 4000;
          state.confirmDeleteFiches[fid] = armedAt;
          render();
          setTimeout(function(){
            if(state.confirmDeleteFiches[fid]===armedAt){ delete state.confirmDeleteFiches[fid]; render(); }
          }, 4000);
          return;
        }
        delete state.confirmDeleteFiches[fid];
        var d = state.ficheDraft;
        var backHash = d && d.fiche ? backHashFor(d.fiche) : "#/";
        deleteFiche(fid, function(success, err){
          if(success){ toast("Fiche supprimée", ""); state.ficheDraft = null; navTo(backHash); }
          else{ toast("Suppression impossible", (err && err.message) || "Réessayez.", true); render(); }
        });
      });
    }
  }

  function openSessionFormModal(id){
    var s = id ? state.sessions.find(function(x){ return String(x.id)===String(id); }) : null;
    var modal = document.getElementById("detailModal");
    modal.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true" aria-label="'+(s?"Modifier la session":"Nouvelle session")+'" style="max-width:640px">'+
        '<div class="modal-head">'+
          '<div>'+
            '<span class="theme-tag">'+ICONS.calendar+' '+(s?"Modifier la session":"Nouvelle session")+'</span>'+
            '<h3 class="modal-title">'+(s?esc(s.name||"Session"):"Créer une session CAMUSAT TALK")+'</h3>'+
          '</div>'+
          '<button type="button" class="modal-close" data-modal-close aria-label="Fermer">'+ICONS.close+'</button>'+
        '</div>'+
        '<div class="modal-body">'+
          '<div class="form-grid" style="margin-top:6px">'+
            editField("sfName","Nom de la session",s?s.name:"","text","full")+
            editField("sfNumber","Numéro de la session",s?s.sessionNumber:"")+
            editField("sfDatetime","Date et heure",s?toLocalDatetimeInputValue(s.sessionDatetime):"","datetime-local")+
            editField("sfLocation","Lieu",s?s.location:"","text","full")+
            editField("sfTeamsLink","Lien Microsoft Teams (optionnel)",s?s.teamsLink:"","url","full")+
            editField("sfPhotosLink","Lien du dossier photos — Google Drive, OneDrive… (optionnel)",s?sessionPhotosLink(s):"","url","full")+
            editTextarea("sfDescription","Description (optionnelle)",s?s.description:"","full")+
          '</div>'+
          '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px">'+
            '<button type="button" class="btn btn-ghost" data-modal-close>Annuler</button>'+
            '<button type="button" class="btn btn-primary" id="btnSaveSession">'+(s?"Enregistrer les modifications":"Créer la session")+'</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    modal.hidden = false;
    document.body.classList.add("modal-open");
    var first = document.getElementById("sfName");
    if(first) first.focus();

    document.getElementById("btnSaveSession").addEventListener("click", function(){
      // Toute la logique est protégée par un try/catch : une exception
      // imprévue (ex. date invalide) ne doit jamais laisser le formulaire
      // dans un état bloqué ou donner l'impression qu'il "se ferme tout
      // seul" — l'utilisateur doit toujours voir un message clair.
      try{
        var dtVal = document.getElementById("sfDatetime").value;
        var dtIso = "";
        if(dtVal){
          var dtParsed = new Date(dtVal);
          if(isNaN(dtParsed.getTime())){
            toast("Date invalide", "Vérifiez la date et l'heure de la session.", true);
            return;
          }
          dtIso = dtParsed.toISOString();
        }
        var data = {
          name: document.getElementById("sfName").value.trim(),
          sessionNumber: document.getElementById("sfNumber").value.trim(),
          sessionDatetime: dtIso,
          location: document.getElementById("sfLocation").value.trim(),
          teamsLink: document.getElementById("sfTeamsLink").value.trim(),
          description: document.getElementById("sfDescription").value.trim()
        };
        // Le lien Microsoft Teams n'est volontairement pas obligatoire : une
        // session peut être 100% en présentiel. Le reste de l'application
        // (détail de session, bannière d'accueil) affiche déjà correctement
        // son absence ("—" / lieu seul).
        var required = ["name","sessionNumber","sessionDatetime","location"];
        var missing = required.some(function(k){ return !data[k]; });
        if(missing){
          toast("Champs incomplets", "Merci de remplir tous les champs (le lien Teams et la description sont optionnels).", true);
          return;
        }
        var photosLink = document.getElementById("sfPhotosLink").value.trim();
        if(photosLink && !/^https:\/\//i.test(photosLink)){
          toast("Lien photos invalide", "Le lien doit commencer par https:// (copiez-le depuis le bouton « Partager » de Google Drive).", true);
          return;
        }
        // Le lien photos vit dans la colonne JSON "roles" (voir sessionPhotosLink) :
        // on relit la session à jour pour ne pas écraser un rôle modifié entre-temps.
        var latest = s ? (state.sessions.find(function(x){ return String(x.id)===String(s.id); }) || s) : null;
        data.roles = Object.assign({}, (latest && latest.roles) || emptySessionRoles(), {photosLink: photosLink});
        var btn = document.getElementById("btnSaveSession");
        btn.disabled = true; btn.textContent = "Enregistrement…";
        if(s){
          updateSession(s.id, data, function(success, err){
            if(success){ toast("Session modifiée", data.name); closeDetailModal(); }
            else{ btn.disabled=false; btn.textContent="Enregistrer les modifications"; toast("Modification impossible", (err&&err.message)||"Réessayez.", true); }
          });
        } else {
          createSession(data, function(success, err){
            if(success){ toast("Session créée", data.name); closeDetailModal(); render(); }
            else{ btn.disabled=false; btn.textContent="Créer la session"; toast("Création impossible", (err&&err.message)||"Réessayez.", true); }
          });
        }
      }catch(ex){
        console.error("Erreur lors de l'enregistrement de la session", ex);
        toast("Erreur inattendue", "L'enregistrement a échoué. Le formulaire reste ouvert : réessayez.", true);
        var btn2 = document.getElementById("btnSaveSession");
        if(btn2){ btn2.disabled = false; btn2.textContent = s ? "Enregistrer les modifications" : "Créer la session"; }
      }
    });
  }

  function bindSessionDetailEvents(id){
    var editBtn = document.getElementById("btnEditSession");
    if(editBtn) editBtn.addEventListener("click", function(){ openSessionFormModal(id); });

    // ---- Mes missions (fiches numériques) : clic direct sur un rôle, le
    // nom est demandé plus loin (voir renderFicheNameGate). ----
    document.querySelectorAll("[data-mission-open]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var ficheRole = btn.getAttribute("data-mission-open");
        if(ficheRole==="mentor"){ navTo("#/fiche/mentor"); return; }
        navTo("#/fiche/s/"+encodeURIComponent(id)+"/"+encodeURIComponent(ficheRole));
      });
    });

    document.querySelectorAll(".btn-delete-session").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sid = btn.getAttribute("data-id");
        if(!isSessionDeleteArmed(sid)){
          var armedAt = Date.now() + 4000;
          state.confirmDeleteSessions[sid] = armedAt;
          btn.classList.add("confirm");
          btn.title = "Cliquer à nouveau pour confirmer la suppression";
          // Si aucun re-rendu ne survient avant l'expiration (pas d'autre
          // action entre-temps), on désarme visuellement ce bouton précis
          // pour ne pas laisser croire qu'un simple clic suffirait encore.
          setTimeout(function(){
            if(state.confirmDeleteSessions[sid]===armedAt){
              delete state.confirmDeleteSessions[sid];
              btn.classList.remove("confirm");
              btn.title = "Supprimer cette session";
            }
          }, 4000);
          return;
        }
        delete state.confirmDeleteSessions[sid];
        btn.disabled = true;
        deleteSession(sid, function(success, err){
          if(success){ toast("Session supprimée", ""); navTo("#/sessions"); }
          else{ btn.disabled = false; toast("Suppression impossible", (err && err.message) || "Réessayez.", true); }
        });
      });
    });

    document.querySelectorAll("[data-role-add-open]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.roleAddOpen = id+"::"+btn.getAttribute("data-role-add-open");
        state.roleAddDraft = "";
        render();
      });
    });
    document.querySelectorAll("[data-role-add-cancel]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.roleAddOpen = null; state.roleAddDraft = ""; render(); });
    });
    document.querySelectorAll("[data-role-add]").forEach(function(form){
      // La saisie est recopiée dans `state.roleAddDraft` à chaque frappe :
      // si un rafraîchissement en arrière-plan régénère toute la page pendant
      // que l'utilisateur tape (avant validation), le formulaire rouvre avec
      // le texte déjà saisi au lieu de le perdre.
      var draftInput = form.querySelector("input");
      if(draftInput) draftInput.addEventListener("input", function(){ state.roleAddDraft = draftInput.value; });
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var roleId = form.getAttribute("data-role-add");
        var input = form.querySelector("input");
        var name = input.value.trim();
        if(!name) return;
        var s = state.sessions.find(function(x){ return String(x.id)===String(id); });
        if(!s) return;
        var roles = s.roles || emptySessionRoles();
        var roleCfg = SESSION_ROLES.find(function(r){ return r.id===roleId; });
        var current = roles[roleId] || [];
        // Pas deux fois la même personne sur un même rôle (comparaison
        // insensible à la casse/aux espaces superflus).
        var alreadyThere = current.some(function(n){ return n.trim().toLowerCase()===name.toLowerCase(); });
        if(alreadyThere){
          state.roleAddOpen = null;
          state.roleAddDraft = "";
          toast(roleCfg ? roleCfg.label : "Rôle", name+" est déjà assigné(e) à ce rôle.", true);
          render();
          return;
        }
        var updated = (roleCfg && roleCfg.multiple) ? current.concat([name]) : [name];
        var newRoles = Object.assign({}, roles);
        newRoles[roleId] = updated;
        state.roleAddOpen = null;
        state.roleAddDraft = "";
        updateSession(id, {roles:newRoles}, function(success){
          if(success && roleCfg) toast("Rôle mis à jour", roleCfg.label+" : "+name);
        });
      });
    });
    document.querySelectorAll("[data-remove-role]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var roleId = btn.getAttribute("data-remove-role");
        var targetName = btn.getAttribute("data-remove-name");
        // On relit `state.sessions` (susceptible d'avoir été rafraîchi par un
        // sondage en arrière-plan depuis le dernier rendu) et on retire par
        // NOM plutôt que par position dans le tableau : un simple index
        // capturé au rendu peut ne plus correspondre à la bonne personne si
        // la liste a changé entre-temps.
        var s = state.sessions.find(function(x){ return String(x.id)===String(id); });
        if(!s) return;
        var roles = s.roles || emptySessionRoles();
        var current = (roles[roleId]||[]).slice();
        var idx = current.findIndex(function(n){ return n===targetName; });
        if(idx===-1) return; // déjà retiré entre-temps
        current.splice(idx,1);
        var newRoles = Object.assign({}, roles);
        newRoles[roleId] = current;
        updateSession(id, {roles:newRoles}, function(success){
          if(success) toast("Personne retirée", "");
        });
      });
    });
  }

        updateAffiche(a.id, {title:title, sessionId:sessionId}, function(success, err){
          if(!success){ afterSave(false, err); return; }
          if(file) replaceAfficheFile(a.id, file, afterSave);

        });
      } else {
        createAffiche(file, {title:title, sessionId:sessionId}, afterSave);

          // triggered between the two clicks (another edit, a background refresh)
          // would otherwise silently disarm the button and strand the user on a
          // third click. isDeleteArmed()/renderDashRows() keep it visually in sync.
          var armedAt = Date.now() + 4000;
          state.confirmDeletes[id] = armedAt;
          btn.classList.add("confirm");
          btn.title = "Cliquer à nouveau pour confirmer la suppression";
          // Et si RIEN ne déclenche de re-rendu avant l'expiration, on

          // "armé" indéfiniment alors que le prochain clic serait en fait
          // traité comme un premier clic.
          setTimeout(function(){
            if(state.confirmDeletes[id]===armedAt){
              delete state.confirmDeletes[id];
              btn.classList.remove("confirm");
              btn.title = "Supprimer cette proposition";

        });

  function toCsv(rows){
    if(!rows.length) return "";
    var headers = Object.keys(rows[0]);
    var lines = [headers.join(";")];
    rows.forEach(function(r){
      lines.push(headers.map(function(h){
        var v = String(r[h]==null?"":r[h]).replace(/"/g,'""');
        return /[;"\n]/.test(v) ? '"'+v+'"' : v;
      }).join(";"));
    });
    return lines.join("\n");
  }

  function offerDownload(filename, blob){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename; a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
      toast("Export prêt", filename);
    }catch(e){
      toast("Export impossible", e.message || "Réessayez.", true);
    }
  }

  function exportCsv(){
    var csv = "﻿" + toCsv(exportRows());
    offerDownload("camusat-talk-propositions.csv", new Blob([csv], {type:"text/csv;charset=utf-8"}));
  }

  function exportXlsx(){
    if(window.XLSX){ buildAndSaveXlsx(); return; }
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = buildAndSaveXlsx;
    s.onerror = function(){ toast("Export Excel indisponible", "Utilisez l'export CSV.", true); };
    document.head.appendChild(s);
  }

  function buildAndSaveXlsx(){
    try{
      var rows = exportRows();
      var ws = window.XLSX.utils.json_to_sheet(rows);
      var wb = window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb, ws, "Propositions");
      var out = window.XLSX.write(wb, {bookType:"xlsx", type:"array"});
      offerDownload("camusat-talk-propositions.xlsx", new Blob([out], {type:"application/octet-stream"}));
    }catch(e){ toast("Export Excel impossible", e.message, true); }
  }

  /* ============================= BIND PER ROUTE ============================= */
  function bindRouteEvents(route){
    if(route==="proposer") bindProposerForm();
    else if(route==="presentateurs") bindPresentateursEvents();
    else if(route==="sessions") bindSessionsEvents();
    else if(route==="media") bindMediaEvents();
    else if(route==="dashboard") bindDashboardEvents();
    else if(route==="fiche") bindFicheRouteEvents();
  }

  /* ============================= INIT ============================= */
  try{ if(sessionStorage.getItem("ct_admin_ok")==="1") state.adminUnlocked = true; }catch(e){}
  state.filters.dashTheme = "";
  initDb();
  render();
})();
</script>
