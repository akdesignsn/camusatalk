<!--
  CAMUSAT TALK — application interne de prise de parole (Camusat Sénégal)
  Voir README.md à la racine du dépôt pour le contexte complet.

  Cette version fonctionne de façon autonome (GitHub Pages, ou n'importe quel
  hébergeur statique) : le stockage des propositions passe par Supabase
  (voir SUPABASE_URL / SUPABASE_ANON_KEY dans le script plus bas), pas par les
  capacités d'un Claude Artifact — n'importe qui avec le lien peut proposer un
  sujet, sans compte d'aucune sorte.

  La clé SUPABASE_ANON_KEY ci-dessous est une clé "publishable" : elle est
  conçue pour être publique et visible dans le code d'une page (comme
  n'importe quelle clé côté client), et la vraie protection vient des
  policies de sécurité (RLS) définies sur la table dans Supabase — voir
  README.md pour le détail. Ne remplace jamais cette valeur par une clé
  secrète/"service_role" : celle-ci donnerait un accès total à la base à
  quiconque lit cette page.

  La constante ADMIN_CODE plus bas est, elle, un simple code d'accès
  d'interface pour le Dashboard (pas un mécanisme de sécurité réel) : change-le
  avant toute diffusion large et ne t'en sers pas comme unique protection de
  données sensibles.
-->

<style>
  :root{
    --navy:#203261;
    --navy-2:#182548;
    --navy-3:#2c4172;
    --navy-tint:#eef1f7;
    --red:#c8102e;
    --red-2:#9c0c22;
    --red-tint:#fdeaec;
    --bg:#f6f7fa;
    --surface:#ffffff;
    --border:#e3e7ee;
    --text:#1b2333;
    --text-muted:#5b6472;
    --text-soft:#848d9c;
    --radius:14px;
    --radius-sm:9px;
    --shadow-sm:0 1px 2px rgba(23,33,63,.06);
    --shadow-md:0 8px 24px -8px rgba(23,33,63,.18);
    --shadow-lg:0 20px 48px -16px rgba(23,33,63,.28);
    --st-attente-bg:#fef3c7; --st-attente-fg:#92400e; --st-attente-bd:#fbdf9a;
    --st-validee-bg:#d9f2ef; --st-validee-fg:#0f5e59; --st-validee-bd:#a9e3db;
    --st-prog-bg:#e6e4fb; --st-prog-fg:#3730a1; --st-prog-bd:#c9c4f5;
    --st-real-bg:#dcfce7; --st-real-fg:#166534; --st-real-bd:#b7ecc8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1524; --surface:#161d33; --border:#2a3455; --text:#e9ecf5; --text-muted:#a8b0c3; --text-soft:#7a8398;
      --navy-tint:#1a2340;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px -8px rgba(0,0,0,.5); --shadow-lg:0 20px 48px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1524; --surface:#161d33; --border:#2a3455; --text:#e9ecf5; --text-muted:#a8b0c3; --text-soft:#7a8398;
    --navy-tint:#1a2340;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px -8px rgba(0,0,0,.5); --shadow-lg:0 20px 48px -16px rgba(0,0,0,.6);
  }
  *,*::before,*::after{box-sizing:border-box}
  /* Les navigateurs donnent par défaut à <fieldset> une largeur minimale
     calée sur son contenu ("min-content"), qui ignore la largeur de son
     conteneur : sur les fiches (formulaire + modale de consultation admin),
     ça pouvait faire déborder toute la page sur mobile dès qu'un tableau un
     peu large (rating_table, repeatable_table...) s'y trouvait, même déjà
     protégé par .table-wrap{overflow-x:auto}. Correctif standard : annuler
     ce min-width implicite. */
  fieldset{min-width:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-inline:0;}
  h1,h2,h3,h4,.font-display{font-family:'Sora',system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance;color:var(--text)}
  p{line-height:1.6;color:var(--text-muted)}
  a{color:inherit}
  button{font-family:inherit}
  .wrap{max-width:1180px;margin-inline:auto;padding-inline:24px}
  @media (max-width:640px){.wrap{padding-inline:16px}}

  /* ---------- Nav ---------- */
  .navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;max-width:1180px;margin-inline:auto;padding-inline:24px}
  @media (max-width:640px){.nav-inner{padding-inline:16px}}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
  .brand svg{display:block}
  .brand-word{font-family:'Sora',sans-serif;font-weight:800;font-size:16.5px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
  .brand-word b{color:var(--navy)}
  .brand-word span{color:var(--red)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-word b{color:#c7d3f2} }
  :root[data-theme="dark"] .brand-word b{color:#c7d3f2}
  .navlinks{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .navlink{font-size:14px;font-weight:600;color:var(--text-muted);padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
  .navlink:hover{background:var(--navy-tint);color:var(--navy)}
  .navlink.active{background:var(--navy);color:#fff}
  .nav-toggle{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer}
  @media (max-width:780px){
    .navlinks{display:none !important}
    /* La marge de sécurité liée à l'encoche/île dynamique est absorbée une
       seule fois par .nav-inner (padding-top) plutôt que par le décalage
       sticky de .navbar, pour éviter un décalage visuel au moment du scroll. */
    .navbar{top:0}
    .nav-inner{justify-content:flex-start;padding-top:calc(12px + env(safe-area-inset-top,0px))}
    .nav-toggle{display:inline-flex;order:-1;width:44px;height:44px;border-radius:12px;align-items:center;justify-content:center;margin-right:2px}
    .nav-toggle svg{width:20px;height:20px}
    .brand{order:0}
  }

  /* ---------- Mobile nav drawer (mobile only, isolated from desktop nav) ---------- */
  body.mobile-drawer-open{overflow:hidden}
  .mobile-nav-overlay{position:fixed;inset:0;z-index:155;background:rgba(15,21,36,.55);opacity:0;pointer-events:none;transition:opacity .22s ease}
  .mobile-nav-overlay.open{opacity:1;pointer-events:auto}
  .mobile-nav-panel{position:fixed;top:0;bottom:0;left:0;z-index:156;width:82%;max-width:340px;background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto}
  .mobile-nav-panel.open{transform:translateX(0)}
  .mnp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 18px;padding-top:calc(20px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--border);flex-shrink:0}
  .mnp-brand{display:flex;align-items:center;gap:10px}
  .mnp-brand svg{display:block;flex-shrink:0}
  .mnp-brand-word{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
  .mnp-brand-word b{color:var(--navy)}
  .mnp-brand-word span{color:var(--red)}
  .mnp-close{background:var(--navy-tint);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);flex-shrink:0;transition:background .15s}
  .mnp-close:hover{background:var(--red-tint);color:var(--red)}
  .mnp-list{display:flex;flex-direction:column;gap:6px;padding:14px}
  .mnp-item{display:flex;align-items:center;gap:14px;padding:14px 14px;border-radius:16px;cursor:pointer;transition:background .15s,transform .12s;position:relative}
  .mnp-item:active{transform:scale(.98)}
  .mnp-icon{width:42px;height:42px;border-radius:13px;background:var(--navy-tint);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .mnp-label{font-size:15.5px;font-weight:700;color:var(--text)}
  .mnp-item:hover{background:var(--navy-tint)}
  .mnp-item.active{background:var(--navy)}
  .mnp-item.active .mnp-label{color:#fff}
  .mnp-item.active .mnp-icon{background:rgba(255,255,255,.18)}
  .mnp-item.active::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--red)}
  .mnp-item.mnp-featured{background:var(--red-tint);border:1.5px solid var(--red-tint)}
  .mnp-item.mnp-featured .mnp-icon{background:var(--red);color:#fff}
  .mnp-item.mnp-featured:hover{background:#fbdadf}
  .mnp-item.mnp-featured.active{background:var(--navy);border-color:var(--navy)}
  .mnp-item.mnp-featured.active .mnp-icon{background:rgba(255,255,255,.22);color:#fff}
  .mnp-foot{margin-top:auto;padding:16px 22px;font-size:12px;color:var(--text-soft);border-top:1px solid var(--border)}
  @media (min-width:781px){
    .mobile-nav-overlay,.mobile-nav-panel{display:none !important}
  }

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .15s,border-color .15s;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 10px 24px -10px rgba(200,16,46,.55)}
  .btn-primary:hover{background:var(--red-2)}
  .btn-secondary{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
  .btn-secondary:hover{background:rgba(255,255,255,.12)}
  .btn-outline-navy{background:var(--surface);border-color:var(--border);color:var(--navy)}
  .btn-outline-navy:hover{border-color:var(--navy);background:var(--navy-tint)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted);padding:8px 14px}
  .btn-ghost:hover{background:var(--navy-tint);color:var(--navy)}
  .btn-sm{padding:8px 16px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-block{width:100%}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.14) 1px,transparent 1.4px);background-size:26px 26px;opacity:.35;pointer-events:none}
  .hero-inner{position:relative;max-width:1180px;margin-inline:auto;padding:64px 24px 72px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  @media (max-width:900px){
    .hero-inner{grid-template-columns:1fr;padding:44px 20px 48px;gap:36px}
    /* Par défaut, un enfant de grille a min-width:auto : un badge de statut
       non coupable (white-space:nowrap) dans .mc-top peut alors forcer toute
       la colonne (donc le Hero) à dépasser la largeur de l'écran. On annule
       ce minimum pour que la carte respecte la largeur de sa colonne, et on
       autorise le badge à passer à la ligne plutôt que de déborder. */
    .hero-card{min-width:0}
    .mini-card{min-width:0}
    .mini-card .mc-top{flex-wrap:wrap}
  }
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#cfd8ef;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;margin-bottom:20px;max-width:100%;flex-wrap:wrap;white-space:normal;row-gap:2px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
  .hero h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;color:#fff;line-height:1.08;margin:0 0 14px}
  .hero .slogan{font-family:'Sora',sans-serif;font-weight:600;font-size:19px;color:#ffd8de;margin:0 0 18px}
  .hero p.lead{color:#c6cee2;font-size:16px;max-width:52ch;margin:0 0 30px}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap}
  .hero-stats{display:flex;gap:28px;margin-top:38px;flex-wrap:wrap}
  .hero-stat b{display:block;font-family:'Sora',sans-serif;font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .hero-stat span{font-size:12.5px;color:#aab6d6;letter-spacing:.02em}
  .hero-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:26px;backdrop-filter:blur(6px)}
  .hero-card .mini-card{background:var(--surface);border-radius:var(--radius-sm);padding:16px;color:var(--text);box-shadow:var(--shadow-lg);margin-bottom:12px}
  .hero-card .mini-card:last-child{margin-bottom:0}
  .mini-card .mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .mini-card h4{font-size:14px;margin:0;font-weight:700}
  .mini-card p{font-size:12.5px;margin:2px 0 0;color:var(--text-soft)}
  .mini-card[data-detail]{cursor:pointer;transition:box-shadow .15s,transform .15s}
  .mini-card[data-detail]:hover{box-shadow:0 24px 40px -14px rgba(0,0,0,.35)}
  .mini-card[data-detail]:hover{transform:translateY(-2px)}
  .mini-card[data-detail]:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  /* ---------- Sections ---------- */
  section{padding-block:64px}
  .section-head{max-width:640px;margin-bottom:40px}
  .section-head .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:8px;display:block}
  .section-head h2{font-size:clamp(22px,3vw,30px);margin:0 0 10px}
  .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:860px){.cards-3{grid-template-columns:1fr}}
  .info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm)}
  .info-card .ic-icon{width:42px;height:42px;border-radius:11px;background:var(--navy-tint);color:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .info-card h3{font-size:16.5px;margin:0 0 8px}
  .info-card p{font-size:14px;margin:0}

  /* ---------- Cards / grid (Présentateurs) ---------- */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:26px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select,input,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
  select:focus,input:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,50,97,.12)}
  .field-select{min-width:190px}
  .search-input{min-width:220px}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .talk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;position:relative;transition:box-shadow .15s,transform .15s}
  .talk-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .theme-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--text-muted)}
  .theme-tag .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .talk-card h3{font-size:16.5px;margin:0;line-height:1.35}
  .talk-card .desc{font-size:13.5px;color:var(--text-muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-soft)}
  .meta-row svg{flex-shrink:0;opacity:.7}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
  .demo-badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft);background:var(--navy-tint);padding:3px 8px;border-radius:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .pill-attente{background:var(--st-attente-bg);color:var(--st-attente-fg);border-color:var(--st-attente-bd)}
  .pill-validee{background:var(--st-validee-bg);color:var(--st-validee-fg);border-color:var(--st-validee-bd)}
  .pill-programmee{background:var(--st-prog-bg);color:var(--st-prog-fg);border-color:var(--st-prog-bd)}
  .pill-realisee{background:var(--st-real-bg);color:var(--st-real-fg);border-color:var(--st-real-bd)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-soft)}
  .empty-state svg{margin-bottom:14px;opacity:.5}
  .talk-card{cursor:pointer}
  .talk-card:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

  /* ---------- Detail modal ---------- */
  body.modal-open{overflow:hidden}
  .modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(15,21,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;animation:modal-fade .15s ease}
  .modal-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);max-width:640px;width:100%;margin:auto;position:relative}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:26px 26px 0}
  .modal-close{background:var(--navy-tint);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);flex-shrink:0;transition:background .15s}
  .modal-close:hover{background:var(--border)}
  .modal-body{padding:16px 26px 28px}
  .modal-title{font-size:20px;margin:6px 0 0}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-top:20px}
  @media (max-width:560px){.detail-grid{grid-template-columns:1fr}}
  .detail-item{display:flex;flex-direction:column;gap:3px}
  .detail-item .dt-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft)}
  .detail-item .dt-value{font-size:14px;color:var(--text)}
  .detail-block{font-size:14px;color:var(--text-muted);line-height:1.6;white-space:pre-wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .detail-block h4{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);margin:0 0 8px}
  .detail-block p{margin:0;color:var(--text-muted)}
  @keyframes modal-fade{from{opacity:0}to{opacity:1}}

  /* ---------- Form ---------- */
  .form-shell{max-width:840px;margin-inline:auto}
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md);padding:36px}
  @media (max-width:640px){.form-card{padding:22px}}
  .form-section{margin-bottom:30px}
  .form-section:last-of-type{margin-bottom:0}
  .form-section-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);margin-bottom:16px}
  .form-section-title .num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  .field label{font-size:13px;font-weight:600;color:var(--text)}
  .field label .req{color:var(--red)}
  .field .hint{font-size:12px;color:var(--text-soft)}
  .field .err{font-size:12px;color:var(--red);display:none}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
  .field.invalid .err{display:block}
  textarea{resize:vertical;min-height:84px}
  .divider{height:1px;background:var(--border);margin-block:26px}
  .char-count{font-size:11.5px;color:var(--text-soft);text-align:right}

  /* ---------- Toast ---------- */
  #toast-root{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 32px))}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--navy);box-shadow:var(--shadow-lg);border-radius:12px;padding:14px 16px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:toast-in .2s ease}
  .toast.error{border-left-color:var(--red)}
  .toast b{display:block;margin-bottom:2px;font-size:13.5px}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- Confirmation ---------- */
  .confirm-panel{max-width:560px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md);padding:48px 32px}
  .confirm-icon{width:64px;height:64px;border-radius:50%;background:var(--st-real-bg);color:var(--st-real-fg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .confirm-panel h2{margin:0 0 10px;font-size:22px}
  .confirm-panel p{margin:0 0 26px}
  .confirm-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* ---------- Dashboard ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
  @media (max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr)}}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .stat-tile b{display:block;font-family:'Sora',sans-serif;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat-tile span{font-size:12px;color:var(--text-soft)}
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  table{width:100%;border-collapse:collapse;min-width:920px}
  thead th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-soft);padding:14px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--navy-tint)}
  .cell-name{font-weight:600}
  .cell-sub{font-size:12px;color:var(--text-soft)}
  .mini-select{font-size:12.5px;padding:6px 8px;border-radius:8px}
  .icon-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--text-muted)}
  .icon-btn:hover{background:var(--navy-tint);color:var(--navy)}
  .icon-btn:disabled{opacity:.5;cursor:not-allowed}
  .icon-btn.confirm{background:var(--red-tint);border-color:var(--red);color:var(--red)}

  /* ---------- Sessions ---------- */
  .detail-item.full{grid-column:1/-1}
  .roles-list{display:flex;flex-direction:column;gap:10px;max-width:840px}
  .role-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .role-label{font-size:13.5px;font-weight:700;min-width:230px;flex-shrink:0}
  .role-people{display:flex;gap:8px;flex-wrap:wrap;flex:1;align-items:center}
  .role-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy-tint);color:var(--navy);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px}
  .role-chip-remove{background:none;border:none;padding:0;display:flex;cursor:pointer;color:var(--navy);opacity:.65}
  .role-chip-remove:hover{opacity:1}
  .role-empty{font-size:12.5px;color:var(--text-soft);font-style:italic}
  .role-add-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .role-add-form input{padding:6px 10px;font-size:12.5px;width:170px}
  @media (max-width:640px){.role-row{flex-direction:column;align-items:stretch}.role-label{min-width:0}}

  /* ---------- Mes missions / Fiches numériques ---------- */
  .mission-card{padding:24px}
  .mission-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .mission-chip{display:inline-flex;align-items:center;gap:8px;background:var(--navy-tint);color:var(--navy);border:1px solid var(--border);font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
  .mission-chip:hover{background:var(--navy);color:#fff}
  .mission-chip svg{opacity:.85}
  .dt-value-sub{font-weight:400;color:var(--text-soft);font-size:12.5px}

  .fiche-progress-wrap{margin:4px 0 22px;display:flex;flex-direction:column;gap:6px}
  .fiche-progress-bar{height:8px;border-radius:999px;background:var(--navy-tint);overflow:hidden}
  .fiche-progress-fill{height:100%;background:var(--red);border-radius:999px;transition:width .2s}
  .fiche-progress-label{font-size:12px;color:var(--text-soft)}

  /* grid-template-columns:minmax(0,1fr) : sans cette ligne, la colonne
     implicite de la grille se dimensionne au contenu le plus large (ici le
     petit tableau "Signalisation"), ce qui peut faire déborder toute la page
     sur mobile (le classique "grid blowout") ; minmax(0,1fr) force la
     colonne à respecter la largeur disponible et laisse le contenu s'adapter
     normalement (retour à la ligne, table-wrap...). */
  .fiche-intro{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:22px}
  .fiche-intro-block{background:var(--navy-tint);border-radius:var(--radius-sm);padding:14px 18px}
  .fiche-intro-block h5{margin:0 0 6px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
  .fiche-intro-block p{margin:0;font-size:13px}
  .fiche-intro-block ul{margin:0;padding-left:18px;font-size:13px;color:var(--text-muted)}
  .fiche-intro-block ul li{margin-bottom:2px}
  .mini-info-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  .mini-info-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
  .mini-info-table tr:last-child td{border-bottom:none}

  .fiche-section{margin-bottom:28px}
  .fiche-section h4{font-size:15.5px;margin:0 0 14px;color:var(--navy)}
  .fiche-section .field{margin-bottom:16px}
  .fiche-section .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
  .fiche-section .field input[type="text"],
  .fiche-section .field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13.5px}
  .fiche-section .field textarea{resize:vertical}

  /* Champs "tableau" des fiches (notes_table, checklist_table, rating_table,
     repeatable_table) : on ne rend plus un <table> avec des colonnes qu'il
     fallait faire défiler horizontalement sur mobile ("je glisse tout le
     temps"). Chaque ligne devient une "rubrique" (carte) autonome, avec ses
     champs empilés verticalement — remplissage naturel au doigt, sans aucun
     défilement latéral, sur mobile comme sur desktop. */
  .fiche-row-cards{display:flex;flex-direction:column;gap:12px}
  .fiche-row-card{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--navy-tint)}
  .fiche-row-card .field{margin-bottom:12px}
  .fiche-row-card .field:last-child{margin-bottom:0}
  .fiche-row-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .fiche-row-card-title{font-size:13.5px;font-weight:700;color:var(--navy);margin:0}
  .fiche-row-card-check{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
  .fiche-row-card-check input[type="checkbox"]{width:18px;height:18px;flex-shrink:0}
  .fiche-row-card input[type="text"],
  .fiche-row-card textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13.5px}
  .fiche-row-card textarea{resize:vertical}

  .radio-row,.checkbox-row{display:flex;gap:16px;flex-wrap:wrap}
  .radio-opt,.chk-opt{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer}
  .chk-opt-other input[type="text"]{padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}

  .fiche-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:26px;padding-top:20px;border-top:1px solid var(--border)}
  .fiche-locked-note{display:flex;align-items:center;gap:8px;margin-top:26px;padding:16px 18px;background:var(--st-real-bg);color:var(--st-real-fg);border-radius:var(--radius-sm);font-size:13.5px;font-weight:600}
  .fiche-locked-note svg{width:18px;height:18px;flex-shrink:0}
  .btn-delete-fiche-self{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-soft);padding:6px 4px;font-family:inherit}
  .btn-delete-fiche-self svg{width:14px;height:14px}
  .btn-delete-fiche-self:hover{color:var(--red)}
  .btn-delete-fiche-self.confirm{color:var(--red)}

  /* ---------- Export PDF des fiches (compte rendu) ---------- */
  /* Conteneur rempli juste avant impression avec le HTML du compte rendu,
     puis vidé après (voir buildFicheExportHtml / exportFichesToPdf). Invisible
     à l'écran en temps normal ; seule la classe "exporting-fiches" posée sur
     <body> juste avant window.print() le fait apparaître (et masque le reste
     de l'app), pour que "Imprimer / Enregistrer en PDF" ne capture que le
     compte rendu, quelle que soit la page où l'on se trouvait. */
  .fiche-export-print-root{display:none}
  body.exporting-fiches > *:not(.fiche-export-print-root){display:none!important}
  body.exporting-fiches .fiche-export-print-root{display:block!important;padding:24px;max-width:900px;margin:0 auto;color:#111;background:#fff}
  .fiche-export-cover{padding-bottom:22px;margin-bottom:10px;border-bottom:2px solid #111}
  .fiche-export-cover h1{font-family:'Sora',sans-serif;font-size:21px;margin:0 0 8px}
  .fiche-export-cover p{margin:2px 0;font-size:13px;color:#333}
  .fiche-export-item{padding-top:22px}
  .fiche-export-item + .fiche-export-item{border-top:2px solid #ccc;margin-top:30px}
  .fiche-export-item h2{font-family:'Sora',sans-serif;font-size:16.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .fiche-export-item .fe-meta{font-size:12.5px;color:#333;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:4px 18px}
  .fiche-export-print-root fieldset{border:none;padding:0;margin:0}
  .fiche-export-print-root input:disabled,.fiche-export-print-root textarea:disabled,.fiche-export-print-root select:disabled{
    opacity:1!important;-webkit-text-fill-color:#111!important;color:#111!important;background:#fff!important;border-color:#bbb!important
  }
  @media print{
    .fiche-export-item{page-break-before:always;break-before:page}
    .fiche-export-item:first-of-type{page-break-before:avoid;break-before:avoid}
  }

  /* ---------- Bannière prochaine session ---------- */
  .session-banner{background:var(--red);color:#fff;border-radius:20px;padding:28px 32px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 14px 32px -12px rgba(200,16,46,.45);display:block}
  .session-banner:hover{transform:translateY(-2px);box-shadow:0 20px 40px -12px rgba(200,16,46,.55)}
  .session-banner:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .session-banner-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffd8de;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .session-banner h3{color:#fff;margin:0 0 8px;font-size:clamp(18px,2.4vw,22px)}
  .session-banner p{color:#ffe1e5;margin:0 0 4px;font-size:14px}
  .session-banner-cta{display:inline-block;margin-top:14px;font-weight:700;font-size:13.5px;color:#fff}
  .photos-block{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--navy-tint);border-radius:18px;padding:20px 24px;margin-bottom:30px}
  .photos-block-icon{width:46px;height:46px;border-radius:13px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .photos-block-text{flex:1;min-width:200px}
  .photos-block-text h3{margin:0 0 3px;font-size:17px}
  .photos-block-text p{margin:0;font-size:14px;color:var(--text-soft)}
  .photos-block .btn{white-space:nowrap}
  .session-banner.is-finished{background:var(--navy);box-shadow:0 14px 32px -12px rgba(32,50,97,.45)}
  .session-banner.is-finished:hover{box-shadow:0 20px 40px -12px rgba(32,50,97,.55)}
  .session-banner.is-finished .session-banner-label{color:#c7d3f2}
  .session-banner.is-finished p{color:#d6def5}
  .session-banner-done{background:#fff;color:var(--navy);border-radius:999px;padding:2px 10px;font-size:11px;letter-spacing:.04em}

  /* ---------- Accueil : session programmée en grand ---------- */
  .session-hero .hero-inner{grid-template-columns:1fr;padding:56px 24px 64px}
  .session-hero .sh-status{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--red);padding:7px 16px;border-radius:999px;margin-bottom:18px;box-shadow:0 10px 24px -10px rgba(200,16,46,.7)}
  .session-hero .sh-status .pulse{width:8px;height:8px;border-radius:50%;background:#fff;animation:sh-pulse 1.8s ease-in-out infinite}
  @keyframes sh-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  .session-hero h1{font-size:clamp(38px,6.6vw,68px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}
  .session-hero h1 em{font-style:normal;color:#ff8d98}
  .session-hero .sh-theme{font-family:'Sora',sans-serif;font-weight:600;font-size:clamp(17px,2.2vw,22px);color:#ffd8de;margin:0 0 10px}
  .session-hero .sh-meta{color:#c6cee2;font-size:15.5px;margin:0 0 28px;display:flex;flex-wrap:wrap;gap:6px 18px}
  .session-hero .sh-meta span{display:inline-flex;align-items:center;gap:7px}
  .session-hero .sh-date-card{background:#fff;color:var(--navy);border-radius:24px;padding:28px 26px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);position:relative}
  .session-hero .sh-date-card .wd{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
  .session-hero .sh-date-card .day{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(76px,10vw,112px);line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
  .session-hero .sh-date-card .mo{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;text-transform:capitalize}
  .session-hero .sh-date-card .hr{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--navy);color:#fff;font-weight:800;font-size:18px;padding:9px 20px;border-radius:999px}
  .session-hero .sh-date-card .cd{margin-top:14px;font-size:13px;font-weight:700;color:var(--text-soft)}
  .session-hero .sh-count{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(18px,2.6vw,24px);padding:10px 22px;border-radius:999px;margin:0 0 30px}
  .session-hero .sh-count-dot{width:10px;height:10px;border-radius:50%;background:#ff8d98;box-shadow:0 0 0 4px rgba(255,141,152,.25)}
  .session-hero .btn-big{padding:15px 28px;font-size:16px}
  @media (max-width:860px){
    .session-hero .hero-inner{grid-template-columns:1fr;padding:40px 20px 48px;gap:30px}
    .session-hero .sh-date-card{padding:22px 20px}
    .session-hero .sh-date-card .day{font-size:84px}
  }
  .agenda-list{display:flex;flex-direction:column;gap:14px;counter-reset:ag}
  /* ---------- Présentations d'une session (avec photos des présentateurs) ---------- */
  .pres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:34px}
  .pres-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px 20px;box-shadow:var(--shadow-sm);cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:box-shadow .15s,transform .15s}
  .pres-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .pres-card:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .pres-num{position:absolute;top:14px;left:14px;width:30px;height:30px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:14px}
  .pres-card:first-child .pres-num{background:var(--red)}
  .pres-photo{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 2px var(--red),var(--shadow-sm);background:var(--navy-tint);margin-bottom:6px}
  .pres-initials{display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-family:'Sora',sans-serif;font-weight:800;font-size:32px}
  .pres-who{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;color:var(--navy)}
  .pres-role{font-size:13px;color:var(--text-soft)}
  .pres-card h4{margin:8px 0 2px;font-size:15px;line-height:1.35}
  .pres-meta{font-size:13px;color:var(--text-soft);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
  .agenda-item{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .15s,transform .15s}
  .agenda-item:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .agenda-item:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .agenda-num{width:56px;height:56px;border-radius:16px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:22px}
  .agenda-item:first-child .agenda-num{background:var(--red)}
  .agenda-body{min-width:0}
  .agenda-body h3{font-size:clamp(16px,2vw,19px);margin:4px 0 4px;line-height:1.3}
  .agenda-body p{margin:0;font-size:14px;color:var(--text-soft)}
  .agenda-who{font-weight:700;color:var(--navy)}
  .agenda-side{text-align:right;font-size:13px;color:var(--text-soft);white-space:nowrap}
  @media (max-width:640px){
    .agenda-item{grid-template-columns:44px 1fr;gap:14px;padding:16px}
    .agenda-num{width:44px;height:44px;border-radius:13px;font-size:18px}
    .agenda-side{grid-column:2;text-align:left;white-space:normal}
  }

  /* ---------- Affiches ---------- */
  .poster-home-card{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 30px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .15s,transform .15s}
  .poster-home-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .poster-home-card:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .poster-home-icon{width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .poster-home-card h3{margin:0 0 4px;font-size:17px}

  var ADMIN_CODE = "CAMUSAT2026";

          { type:"text", key:"utilisation", label:"Utilisation / correction" }

      ],
      sections: [

  function fmtDate(iso){

  // (new Date().toISOString() renvoie la date en UTC, ce qui peut décaler
  // le "aujourd'hui" d'un jour près de minuit pour un visiteur hors UTC+0.)
  function todayLocalDateStr(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }

    }catch(e){ return iso; }

  function fmtSessionDateTime(iso){

      var dayLabel = d.toLocaleDateString("fr-FR", {weekday:"long"});
      dayLabel = dayLabel.charAt(0).toUpperCase() + dayLabel.slice(1);
      var dateLabel = d.toLocaleDateString("fr-FR", {day:"2-digit", month:"long", year:"numeric"});
      var pad = function(n){ return (n<10?"0":"")+n; };
      return dayLabel+" "+dateLabel+" à "+pad(d.getHours())+"h"+pad(d.getMinutes());
    }catch(e){ return iso; }
  }

  // Accepte watch?v=ID, youtu.be/ID, shorts/ID et embed/ID, avec ou sans
  // paramètres supplémentaires (&t=..., ?si=...).
  function extractYoutubeId(url){
    if(!url) return null;
    var m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/.exec(url.trim());
    return m ? m[1] : null;
  }

  /* Fiches de rôle CAMUSAT TALK (Grammarian, Timekeeper, Posture Visualizer,
     Évaluateur, Mentor) : table Supabase séparée "fiche_reponses", sans lien
     formel avec "sessions" ou "propositions" au niveau base de données (une
     simple colonne id nullable de chaque côté selon la portée de la fiche —
     voir FICHE_SCOPE plus haut). Les réponses elles-mêmes sont stockées dans
     une colonne JSON ("form_data"), comme pour "roles" sur les sessions :
     un même formulaire générique (voir renderFicheFields) sait lire/écrire
     ce JSON pour n'importe quel type de fiche, sans table dédiée par rôle. */
  var LOCAL_FICHES_FALLBACK = [];
  var FICHE_FIELD_MAP = {
    sessionId:"session_id", propositionId:"proposition_id", roleKey:"role_key",
    participantName:"participant_name", intervenantName:"intervenant_name",
    status:"status", formData:"form_data", submittedAt:"submitted_at"
  };
  function toFicheDbRow(v){
    var out = {};
    Object.keys(FICHE_FIELD_MAP).forEach(function(k){ if(v[k]!==undefined) out[FICHE_FIELD_MAP[k]] = v[k]; });
    return out;
  }
  function fromFicheDbRow(r){
    var out = { id:r.id, createdAt:r.created_at, updatedAt:r.updated_at };
    Object.keys(FICHE_FIELD_MAP).forEach(function(k){ out[k] = r[FICHE_FIELD_MAP[k]]; });
    if(!out.formData) out.formData = {};
    return out;

    root.appendChild(el);
    setTimeout(function(){ el.style.transition="opacity .25s,transform .25s"; el.style.opacity="0"; el.style.transform="translateY(-6px)"; setTimeout(function(){ el.remove(); }, 260); }, 4200);

  function isEditingSomething(){

    // NB : la saisie du formulaire "ajouter une personne à un rôle" n'a pas
    // besoin d'être détectée ici — elle est recopiée en direct dans

    // le focus n'est plus sur le champ.

  function nextUpcomingSession(){
    var now = new Date().toISOString();
    var upcoming = sessionsSorted().filter(function(s){ return s.sessionDatetime && s.sessionDatetime >= now; });
    return upcoming.length ? upcoming[0] : null;

  // Session "la plus pertinente maintenant" pour un lien/QR Guest permanent
  // (voir renderGuestShortcut, route "#/guest") : la session déjà commencée
  // la plus récente (on scanne le QR PENDANT ou juste après la session, donc
  // nextUpcomingSession() — strictement future — la raterait), avec repli sur
  // la prochaine session à venir si aucune n'a encore démarré (ex. quelqu'un
  // teste le lien avant l'ouverture des portes).
  function sessionForGuestQR(){
    var now = new Date().toISOString();
    var started = sessionsSorted().filter(function(s){ return s.sessionDatetime && s.sessionDatetime <= now; });
    if(started.length) return started[started.length-1];
    return nextUpcomingSession();
  }

  // "Votre nom" sert seulement à attribuer une NOUVELLE fiche, jamais à

    var row = { type:"video", title: meta.title, description: meta.description||"", mediaDate: meta.mediaDate||null, status: meta.status, youtubeUrl: meta.youtubeUrl, youtubeId: meta.youtubeId, thumbnailUrl: meta.thumbnailUrl };
    if(sb){
      var dbRow = toMediaDbRow(row);
      dbRow.created_at = new Date().toISOString();
      sb.from("medias").insert([dbRow]).then(function(res){
        if(res.error){ cb(false, res.error); return; }
        fetchAllMedias();
        cb(true);
      });
    } else {
      row.id = uid();
      row.createdAt = new Date().toISOString();
      LOCAL_MEDIAS_FALLBACK.unshift(row);
      state.medias = LOCAL_MEDIAS_FALLBACK;
      cb(true);
    }
  }

  function updateMedia(id, patch, cb){
    if(sb){
      sb.from("medias").update(toMediaDbRow(patch)).eq("id", id).then(function(res){
        if(res.error){
          toast("Modification impossible", res.error.message || "Réessayez dans un instant.", true);
          if(cb) cb(false, res.error);
          return;
        }
        fetchAllMedias();
        if(cb) cb(true);
      });
    } else {
      var it = LOCAL_MEDIAS_FALLBACK.find(function(x){ return x.id===id; });
      if(it){ Object.assign(it, patch); state.medias = LOCAL_MEDIAS_FALLBACK; render(); }
      if(cb) cb(true);
    }
  }

  function replaceMediaFile(id, file, cb){
    if(!mediaFileValid(file)){
      cb(false, {message:"Format non pris en charge ou fichier trop volumineux (8 Mo max)."});
      return;
    }
    var it = mediaById(id);
    if(sb){
      uploadMediaFile(file, function(success, err, up){
        if(!success){ cb(false, err); return; }
        sb.from("medias").update({image_url:up.imageUrl, image_path:up.imagePath}).eq("id", id).then(function(res){
          if(res.error){ removeMediaFile(up.imagePath, function(){}); cb(false, res.error); return; }
          if(it && it.imagePath) removeMediaFile(it.imagePath, function(){});
          fetchAllMedias();
          cb(true);
        });
      });
    } else {
      var reader = new FileReader();
      reader.onload = function(){
        if(it){ it.imageUrl = reader.result; state.medias = LOCAL_MEDIAS_FALLBACK; render(); }
        cb(true);
      };
      reader.onerror = function(){ cb(false, {message:"Lecture du fichier impossible."}); };
      reader.readAsDataURL(file);
    }
  }

  function deleteMedia(id, cb){
    var it = mediaById(id);
    if(sb){
      sb.from("medias").delete().eq("id", id).then(function(res){
        if(res.error){ cb(false, res.error); return; }
        if(it && it.imagePath) removeMediaFile(it.imagePath, function(){});
        fetchAllMedias();
        cb(true);
      });
    } else {
      var idx = LOCAL_MEDIAS_FALLBACK.findIndex(function(x){ return x.id===id; });
      if(idx>-1) LOCAL_MEDIAS_FALLBACK.splice(idx,1);
      state.medias = LOCAL_MEDIAS_FALLBACK;
      render();
      cb(true);
    }
  }

  function isMediaDeleteArmed(id){
    var exp = state.confirmDeleteMedias[id];
    return !!exp && exp > Date.now();
  }

  /* ============================= ROUTER ============================= */
  function currentRoute(){
    var h = location.hash || "#/";
    if(h.indexOf("#/proposer")===0) return "proposer";
    if(h.indexOf("#/presentateurs")===0) return "presentateurs";
    if(h.indexOf("#/sessions")===0) return "sessions";
    if(h.indexOf("#/affiches")===0) return "affiches";
    if(h.indexOf("#/media")===0) return "media";
    if(h.indexOf("#/dashboard")===0) return "dashboard";
    if(h.indexOf("#/fiche/")===0) return "fiche";
    // Lien court et permanent (voir sessionForGuestQR) : à imprimer une
    // seule fois sur un QR code, il reste valable d'une session à l'autre.
    if(h.indexOf("#/guest")===0) return "guest";
    return "accueil";
  }
  function sessionIdFromHash(){
    var m = /^#\/sessions\/(.+)$/.exec(location.hash||"");
    return m ? decodeURIComponent(m[1]) : null;
  }
  // Fiches numériques : trois formes d'URL possibles (voir commentaire plus
  // haut sur FICHE_SCOPE) —
  //   #/fiche/s/<sessionId>/<roleKey>            (chooser, ou éditeur direct
  //                                               si le rôle est "session"
  //                                               unique, ex. Timekeeper)
  //   #/fiche/s/<sessionId>/<roleKey>/<ficheId>  (éditeur d'une fiche précise,
  //                                               rôles "par intervenant")
  //   #/fiche/p/<propositionId>                  (fiche Mentor)
  function ficheRouteInfo(){
    var h = location.hash || "";
    if(h.indexOf("#/fiche/mentor")===0) return {kind:"mentor-chooser"};
    var m1 = /^#\/fiche\/s\/([^\/]+)\/([^\/]+)\/([^\/]+)$/.exec(h);
    if(m1) return {kind:"session-editor", sessionId:decodeURIComponent(m1[1]), roleKey:decodeURIComponent(m1[2]), ficheId:decodeURIComponent(m1[3])};
    var m2 = /^#\/fiche\/s\/([^\/]+)\/([^\/]+)$/.exec(h);
    if(m2) return {kind:"session-role", sessionId:decodeURIComponent(m2[1]), roleKey:decodeURIComponent(m2[2])};
    var m3 = /^#\/fiche\/p\/([^\/]+)$/.exec(h);
    if(m3) return {kind:"proposition", propositionId:decodeURIComponent(m3[1])};
    return null;
  }
  function navTo(hash){ location.hash = hash; }

  function updateActiveNav(){
    var route = currentRoute();
    var map = {accueil:"#/", proposer:"#/proposer", presentateurs:"#/presentateurs", sessions:"#/sessions", affiches:"#/affiches", media:"#/media", dashboard:"#/dashboard"};
    document.querySelectorAll(".navlink").forEach(function(el){
      el.classList.toggle("active", el.getAttribute("data-nav")===map[route]);
    });
    document.querySelectorAll(".mnp-item").forEach(function(el){
      el.classList.toggle("active", el.getAttribute("data-nav")===map[route]);
    });
  }

  // ---------- Menu mobile (tiroir latéral, mobile uniquement) ----------
  function openMobileDrawer(){
    var overlay = document.getElementById("mobileNavOverlay");
    var panel = document.getElementById("mobileNavPanel");
    if(!overlay || !panel) return;
    overlay.hidden = false;
    panel.hidden = false;
    // Force reflow avant d'ajouter la classe "open" pour garantir l'animation.
    void panel.offsetWidth;
    overlay.classList.add("open");
    panel.classList.add("open");
    document.body.classList.add("mobile-drawer-open");
  }
  function closeMobileDrawer(){
    var overlay = document.getElementById("mobileNavOverlay");
    var panel = document.getElementById("mobileNavPanel");
    if(!overlay || !panel) return;
    overlay.classList.remove("open");
    panel.classList.remove("open");
    document.body.classList.remove("mobile-drawer-open");
    setTimeout(function(){
      if(!panel.classList.contains("open")){ overlay.hidden = true; panel.hidden = true; }
    }, 260);
  }
  function isMobileDrawerOpen(){
    var panel = document.getElementById("mobileNavPanel");
    return !!(panel && panel.classList.contains("open"));
  }
  // Filet de sécurité : si Safari iOS restaure la page depuis son cache
  // (retour arrière), s'assurer que le tiroir mobile et le blocage de
  // scroll qui l'accompagne ne restent jamais bloqués dans un état ouvert.
  window.addEventListener("pageshow", function(){
    var overlay = document.getElementById("mobileNavOverlay");
    var panel = document.getElementById("mobileNavPanel");
    if(overlay){ overlay.classList.remove("open"); overlay.hidden = true; }
    if(panel){ panel.classList.remove("open"); panel.hidden = true; }
    document.body.classList.remove("mobile-drawer-open");
  });

  window.addEventListener("hashchange", function(){
    // Un changement de route (bouton précédent/suivant, lien direct, etc.)
    // rend obsolète le contenu de la modale de détail si elle était ouverte :
    // on la ferme pour éviter qu'elle reste affichée par-dessus une autre page.
    closeDetailModal();
    // Idem pour la porte d'entrée "Votre nom" d'une fiche : elle redevient
    // obligatoire dès qu'on quitte le rôle en cours (retour à la session,
    // rôle différent…), pour qu'une autre personne puisse facilement saisir
    // le sien. Elle reste en revanche acquise tant qu'on va-et-vient entre la
    // liste "Mes fiches X" et une fiche précise de ce même rôle (même clé
    // session+rôle), pour ne pas la redemander inutilement en boucle.
    var fInfo = ficheRouteInfo();
    var fKey = (fInfo && (fInfo.kind==="session-role" || fInfo.kind==="session-editor")) ? (fInfo.sessionId+"::"+fInfo.roleKey) : null;
    if(fKey !== state.ficheGateConfirmedFor){ state.ficheGateConfirmedFor = null; }
    render();
  });
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-nav]");
    if(t){
      // Un data-nav cliqué depuis l'intérieur de la modale de détail (ex. le
      // bouton "Remplir la fiche Mentor") doit d'abord fermer cette modale :
      // sinon elle reste affichée par-dessus la page nouvellement ouverte.
      if(t.closest("#detailModal")) closeDetailModal();
      if(t.closest(".mnp-item")) closeMobileDrawer();
      navTo(t.getAttribute("data-nav"));
      // On s'arrête ici : un data-nav peut se trouver à l'intérieur d'une
      // carte cliquable (data-detail/data-poster/data-media) — par exemple
      // le bouton "Remplir la fiche Mentor" sur une carte présentateur — et
      // ne doit déclencher que la navigation, pas aussi l'ouverture de la
      // modale/lightbox de cette carte.
      return;
    }
    var d = e.target.closest("[data-detail]");
    if(d){ openDetailModal(d.getAttribute("data-detail")); }
    var p = e.target.closest("[data-poster]");
    if(p){ openPosterLightbox(p.getAttribute("data-poster")); }
    var med = e.target.closest("[data-media]");
    if(med){ openMediaLightbox(med.getAttribute("data-media")); }
    var fav = e.target.closest("[data-fiche-admin-view]");
    if(fav){ openFicheAdminViewModal(fav.getAttribute("data-fiche-admin-view")); }
    // Export PDF des fiches d'une session précise (bloc admin de la page
    // Session) — même moteur que le bouton "Exporter en PDF" du Dashboard,
    // mais restreint à cette session.
    var fexp = e.target.closest("[data-export-session-fiches]");
    if(fexp){
      var sid = fexp.getAttribute("data-export-session-fiches");
      var sess = state.sessions.find(function(x){ return String(x.id)===String(sid); });
      var label = sess ? (sess.name||("Session #"+(sess.sessionNumber||"—"))) : "Session";
      exportFichesToPdf(fichesForSessionAdmin(sid), label);
    }
    // Suppression d'une fiche depuis une vue administrateur (onglet Fiches du
    // Dashboard, ou bloc "Fiches de la session") : même logique "cliquer deux
    // fois pour confirmer" que les autres suppressions de l'app.
    var fdel = e.target.closest("[data-fiche-admin-delete]");
    if(fdel){
      var fid = fdel.getAttribute("data-fiche-admin-delete");
      if(!isFicheDeleteArmed(fid)){
        var fArmedAt = Date.now() + 4000;
        state.confirmDeleteFiches[fid] = fArmedAt;
        fdel.classList.add("confirm");
        fdel.title = "Cliquer à nouveau pour confirmer la suppression";
        setTimeout(function(){
          if(state.confirmDeleteFiches[fid]===fArmedAt){
            delete state.confirmDeleteFiches[fid];
            fdel.classList.remove("confirm");
            fdel.title = "Supprimer cette fiche";
          }
        }, 4000);
      } else {
        delete state.confirmDeleteFiches[fid];
        fdel.disabled = true;
        deleteFiche(fid, function(success, err){
          if(success){ toast("Fiche supprimée", ""); }
          else{ fdel.disabled = false; toast("Suppression impossible", (err && err.message) || "Réessayez.", true); }
        });
      }
    }
    // Ferme la fenêtre de détail si on clique sur le fond sombre ou sur le
    // bouton de fermeture (mais pas sur son contenu, qui n'a pas cet attribut).
    if(e.target.id==="detailModal" || e.target.closest("[data-modal-close]")){ closeDetailModal(); }
    // Ferme l'affiche/média en grand format (fond sombre ou bouton de fermeture).
    if(e.target.id==="lightboxOverlay" || e.target.closest("[data-lightbox-close]")){ closePosterLightbox(); }
    // Menu mobile : fermeture via le bouton X ou un clic sur l'overlay sombre.
    if(e.target.id==="mobileNavOverlay" || e.target.closest("#mobileNavClose")){ closeMobileDrawer(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      var lightbox = document.getElementById("lightboxOverlay");
      if(lightbox && !lightbox.hidden){ closePosterLightbox(); return; }
      var modal = document.getElementById("detailModal");
      if(modal && !modal.hidden){ closeDetailModal(); return; }
      if(isMobileDrawerOpen()){ closeMobileDrawer(); }
      return;
    }
    if(e.key==="Enter" || e.key===" "){
      var card = e.target.closest && e.target.closest("[data-detail]");
      if(card){ e.preventDefault(); openDetailModal(card.getAttribute("data-detail")); return; }
      var poster = e.target.closest && e.target.closest("[data-poster]");
      if(poster){ e.preventDefault(); openPosterLightbox(poster.getAttribute("data-poster")); return; }
      var med = e.target.closest && e.target.closest("[data-media]");
      if(med){ e.preventDefault(); openMediaLightbox(med.getAttribute("data-media")); return; }
      var navBtn = e.target.closest && e.target.closest("[data-nav][role='button']");
      if(navBtn){ e.preventDefault(); navTo(navBtn.getAttribute("data-nav")); }
    }
  });

    if(first) first.focus();

    document.getElementById("btnSaveEdit").addEventListener("click", function(){
      var patch = {
        presenterName: document.getElementById("editPresenterName").value.trim(),
        presenterRole: document.getElementById("editPresenterRole").value.trim(),
        presenterEmail: document.getElementById("editPresenterEmail").value.trim(),
        title: document.getElementById("editTitle").value.trim(),
        description: document.getElementById("editDescription").value.trim(),
        theme: document.getElementById("editTheme").value,
        mentorName: document.getElementById("editMentorName").value.trim(),
        mentorDept: document.getElementById("editMentorDept").value.trim(),
        objective: document.getElementById("editObjective").value.trim(),
        duration: document.getElementById("editDuration").value,
        desiredDate: document.getElementById("editDesiredDate").value,
        status: document.getElementById("editStatus").value
      };
      var required = ["presenterName","presenterRole","presenterEmail","title","description","duration","desiredDate"];
      var missing = required.some(function(k){ return !patch[k]; });
      if(missing){
        toast("Champs incomplets", "Merci de remplir tous les champs avant d'enregistrer.", true);
        return;
      }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(patch.presenterEmail)){
        toast("E-mail invalide", "Vérifiez l'adresse e-mail du présentateur.", true);
        return;
      }
      var btn = document.getElementById("btnSaveEdit");
      btn.disabled = true; btn.textContent = "Enregistrement…";
      updateProposition(id, patch, function(success, err){
        if(success){
          toast("Proposition modifiée", patch.title);
          closeDetailModal();
        } else {
          btn.disabled = false; btn.textContent = "Enregistrer les modifications";
          toast("Modification impossible", (err && err.message) || "Réessayez dans un instant.", true);
        }
      });
    });

  /* ============================= RENDER: ROOT ============================= */
  // Mémorise la "page" (route + éventuel identifiant de session) affichée au
  // dernier rendu, pour ne remonter en haut de l'écran que lors d'une VRAIE
  // navigation. Sans cela, tout rafraîchissement en arrière-plan (sondage
  // Supabase toutes les 15s) ou toute interaction sur la page courante
  // (ouvrir un formulaire de rôle, créer une session...) rappelle render()
  // et faisait remonter la page en haut alors même que l'utilisateur est en
  // train de la consulter ou de la faire défiler.
  var lastRenderedRouteKey = null;
  function render(){
    updateActiveNav();
    var route = currentRoute();
    var view = document.getElementById("view");
    if(route==="accueil") view.innerHTML = renderHome();
    else if(route==="proposer") view.innerHTML = renderProposer();
    else if(route==="presentateurs") view.innerHTML = renderPresentateurs();
    else if(route==="sessions") view.innerHTML = renderSessions();
    else if(route==="affiches") view.innerHTML = renderAffichesGallery();
    else if(route==="media") view.innerHTML = renderMediaGallery();
    else if(route==="dashboard") view.innerHTML = renderDashboard();
    else if(route==="fiche") view.innerHTML = renderFicheRoute();
    else if(route==="guest") view.innerHTML = renderGuestShortcut();
    var routeKey = route + (route==="sessions" ? ":"+(sessionIdFromHash()||"") : "") + (route==="fiche" ? ":"+location.hash : "");
    if(routeKey !== lastRenderedRouteKey){
      window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
    }
    lastRenderedRouteKey = routeKey;
    bindRouteEvents(route);
  }

  function renderSessionHero(sess){
    var d = new Date(sess.sessionDatetime);
    var wd = d.toLocaleDateString("fr-FR",{weekday:"long"});
    var mo = d.toLocaleDateString("fr-FR",{month:"long"})+" "+d.getFullYear();
    var days = Math.ceil((d.getTime()-Date.now())/86400000);
    var cd = days<=0 ? "C'est aujourd'hui !" : (days===1 ? "C'est demain !" : "Dans "+days+" jours");
    var num = sess.sessionNumber ? String(sess.sessionNumber).replace(/^#/,"") : "";
    if(/^\d$/.test(num)) num = "0"+num;
    var meta = [];
    if(sess.location) meta.push('<span>'+ICONS.mentor.replace('<circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke-linecap="round"/>','<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>')+' '+esc(sess.location)+'</span>');

      '<div class="hero-inner">'+
        '<div>'+

  function renderNextSessionBanner(){
    // Session à venir en priorité ; sinon, la dernière session passée reste
    // visible sur l'accueil avec la mention « Terminée » (au lieu de disparaître).
    var s = nextUpcomingSession();
    if(s) return ""; // la session à venir est déjà affichée en grand (renderSessionHero)
    var finished = false;
    if(!s){
      var past = sessionsSorted().filter(function(x){ return x.sessionDatetime; });
      if(!past.length) return "";
      s = past[past.length-1];
      finished = true;
    }
    var line2 = [s.location, s.teamsLink && !finished ? "Microsoft Teams" : ""].filter(Boolean).join(" | ");
    return '<section class="wrap">'+
      '<div class="session-banner'+(finished ? ' is-finished' : '')+'" data-nav="#/sessions/'+esc(s.id)+'" role="button" tabindex="0" aria-label="Voir les détails de la session '+esc(s.name||"")+'">'+
        '<div class="session-banner-label">'+ICONS.calendar+' '+(finished ? 'Dernière session CAMUSAT TALK <span class="session-banner-done">Terminée</span>' : 'Prochaine session CAMUSAT TALK')+'</div>'+
        '<h3>Session #'+esc(s.sessionNumber||"—")+' – '+esc(s.name||"Sans titre")+'</h3>'+
        '<p>'+fmtSessionDateTime(s.sessionDatetime)+'</p>'+
        (line2 ? '<p>'+esc(line2)+'</p>' : '')+
        '<span class="session-banner-cta">Voir les détails →</span>'+
      '</div>'+
    '</section>';
  }

  function field(id,label,type,required,extraClass){
    return '<div class="field'+(extraClass?" "+extraClass:"")+'">'+
      '<label for="'+id+'">'+esc(label)+(required?' <span class="req">*</span>':'')+'</label>'+
      '<input type="'+type+'" id="'+id+'" name="'+id+'" autocomplete="off">'+
      '<div class="err">Ce champ est requis.</div>'+
    '</div>';
  }

  function bindProposerForm(){
    // Le bouton "Proposer un autre sujet" n'existe que sur l'écran de
    // confirmation (donc sans #talkForm à ce moment-là) : on le lie avant le
    // "return" ci-dessous, sinon ce clic ne fait jamais rien.
    var another = document.getElementById("btnAnotherProposal");
    if(another){ another.addEventListener("click", function(){ state.lastSubmitted = null; render(); }); }

    var form = document.getElementById("talkForm");
    if(!form) return;

    var desc = document.getElementById("description");
    var descCount = document.getElementById("descCount");
    if(desc){ desc.addEventListener("input", function(){ descCount.textContent = desc.value.length; }); }

    form.addEventListener("submit", function(e){
      e.preventDefault();
      // Le mentor (mentorName/mentorDept) est facultatif : un présentateur sans
      // mentor identifié peut soumettre son sujet, l'équipe RH lui en assignera
      // un depuis le Dashboard (champ "Mentor" déjà modifiable en ligne).
      var allFields = ["presenterName","presenterRole","presenterEmail","title","description","theme","mentorName","mentorDept","objective","duration","desiredDate"];
      var required = ["presenterName","presenterRole","presenterEmail","title","description","theme","duration","desiredDate"];
      var ok = true;
      var values = {};
      allFields.forEach(function(name){
        var el = document.getElementById(name);
        var fieldWrap = el.closest(".field");
        var val = el.value.trim();
        values[name] = val;
        var isRequired = required.indexOf(name) !== -1;
        var valid = !isRequired || val.length>0;
        if(name==="presenterEmail" && val){ valid = valid && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val); }
        if(name==="desiredDate" && val){ valid = valid && (val >= todayLocalDateStr()); }
        fieldWrap.classList.toggle("invalid", !valid);
        if(!valid) ok = false;
      });
      if(!ok){
        toast("Formulaire incomplet", "Merci de vérifier les champs en rouge.", true);
        var firstInvalid = form.querySelector(".field.invalid input, .field.invalid select, .field.invalid textarea");
        if(firstInvalid) firstInvalid.focus();
        return;
      }
      var submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true; submitBtn.textContent = "Enregistrement…";
      createProposition(values, function(success, err){
        submitBtn.disabled = false; submitBtn.textContent = "Enregistrer ma proposition";
        if(success){
          state.lastSubmitted = values;
          toast("Proposition enregistrée", values.title);
          render();
        } else {
          toast("Erreur d'enregistrement", (err && err.message) || "Merci de réessayer.", true);
        }
      });
    });
  }

  /* ============================= PRÉSENTATEURS ============================= */
  function renderPresentateurs(){
    var themeOptions = THEMES.map(function(t){ return '<option value="'+t.id+'">'+esc(t.label)+'</option>'; }).join("");
    var statusOptions = STATUSES.map(function(s){ return '<option value="'+s.id+'">'+esc(s.label)+'</option>'; }).join("");

    var filtered = itemsSorted().filter(applyFilters);

    return '<section class="wrap">'+
      '<div class="section-head">'+
        '<span class="kicker">Communauté</span>'+
        '<h2>Les présentateurs CAMUSAT TALK</h2>'+
        '<p>Parcourez les sujets proposés par vos collègues et suivez l\'avancement de chaque présentation.</p>'+
      '</div>'+
      '<div class="toolbar">'+
        '<div class="filters">'+
          '<select class="field-select" id="filterTheme"><option value="">Toutes les thématiques</option>'+themeOptions+'</select>'+
          '<select class="field-select" id="filterStatus"><option value="">Tous les statuts</option>'+statusOptions+'</select>'+
          '<input class="search-input" id="filterSearch" type="search" placeholder="Rechercher un sujet, un présentateur…">'+
        '</div>'+
        '<div style="color:var(--text-soft);font-size:13px">'+filtered.length+' sujet(s)</div>'+
      '</div>'+
      '<div id="cardsGrid">'+ (filtered.length ? renderCardsGrid(filtered) : renderEmptyState()) +'</div>'+
    '</section>';
  }

  function applyFilters(it){
    if(state.filters.theme && it.theme !== state.filters.theme) return false;
    if(state.filters.status && it.status !== state.filters.status) return false;
    if(state.filters.q){
      var q = state.filters.q.toLowerCase();
      var hay = [it.title,it.presenterName,it.mentorName,it.description].join(" ").toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }

  function renderEmptyState(){
    return '<div class="empty-state">'+ICONS.empty+'<div>Aucun sujet ne correspond à ces filtres pour le moment.</div></div>';
  }

  function renderCardsGrid(list){
    return '<div class="grid-cards">' + list.map(function(it){
      var th = themeById(it.theme);
      var mentorFiche = it.mentorName ? ficheForProposition(it.id, "mentor") : null;
      var mst = mentorFiche ? ficheStatusById(mentorFiche.status) : null;
      return '<div class="talk-card" data-detail="'+esc(it.id)+'" role="button" tabindex="0" aria-label="Voir le détail de '+esc(it.title)+'">'+
        (it.demo ? '<span class="demo-badge">Exemple</span>' : '')+
        '<span class="theme-tag"><span class="dot" style="background:'+th.color+'"></span>'+esc(th.label)+'</span>'+
        '<h3>'+esc(it.title)+'</h3>'+
        '<p class="desc">'+esc(it.description||"")+'</p>'+
        '<div class="meta-row">'+ICONS.mentor+' Mentor : '+esc(it.mentorName||"—")+'</div>'+
        '<div class="meta-row">'+ICONS.calendar+' '+fmtDate(it.desiredDate)+' · '+ICONS.clock+' '+esc(it.duration||"—")+'</div>'+
        (it.mentorName ?
          '<div class="meta-row" style="justify-content:space-between;align-items:center">'+
            '<button type="button" class="btn btn-outline-navy btn-sm" data-nav="#/fiche/p/'+esc(it.id)+'">'+ICONS.file+' Fiche Mentor</button>'+
            (mst ? '<span class="pill '+mst.pill+'">'+esc(mst.label)+'</span>' : '')+
          '</div>'
          : '')+
        '<div class="card-foot"><span style="font-size:13px;font-weight:600">'+esc(it.presenterName)+'</span>'+statusPill(it.status)+'</div>'+
      '</div>';
    }).join("") + '</div>';
  }

  function bindPresentateursEvents(){
    var ft = document.getElementById("filterTheme");
    var fs = document.getElementById("filterStatus");
    var fq = document.getElementById("filterSearch");
    if(ft) ft.value = state.filters.theme;
    if(fs) fs.value = state.filters.status;
    if(fq) fq.value = state.filters.q;
    function refresh(){
      var filtered = itemsSorted().filter(applyFilters);
      document.getElementById("cardsGrid").innerHTML = filtered.length ? renderCardsGrid(filtered) : renderEmptyState();
      var counter = document.querySelector(".toolbar > div:last-child");
      if(counter) counter.textContent = filtered.length + " sujet(s)";
    }
    if(ft) ft.addEventListener("change", function(){ state.filters.theme = ft.value; refresh(); });
    if(fs) fs.addEventListener("change", function(){ state.filters.status = fs.value; refresh(); });
    if(fq) fq.addEventListener("input", function(){ state.filters.q = fq.value; refresh(); });
  }

  /* ============================= SESSIONS =============================
     Fonctionnalité indépendante des propositions/présentateurs : aucune
     donnée présentateur/mentor n'est dupliquée ni ré-affichée ici. La
     consultation (liste + détails + rôles) est ouverte à tous ; la
     création/modification/suppression d'une session est réservée à
     l'espace administrateur (même code d'accès que le Dashboard), mais
     l'ajout et le retrait d'une personne à un rôle sont ouverts à tous,
     sans code d'accès. */
  function renderSessions(){
    var id = sessionIdFromHash();
    return id ? renderSessionDetail(id) : renderSessionsList();
  }

  function renderSessionsList(){
    var list = sessionsSorted();
    return '<section class="wrap">'+
      '<div class="toolbar" style="margin-bottom:22px">'+
        '<div class="section-head" style="margin:0">'+
          '<span class="kicker">Organisation</span>'+
          '<h2 style="margin-bottom:0">Sessions CAMUSAT TALK</h2>'+
        '</div>'+
        (state.adminUnlocked ? '<button class="btn btn-primary btn-sm" id="btnNewSession">'+ICONS.plus+' Nouvelle session</button>' : '')+
      '</div>'+
      (list.length ? '<div class="grid-cards" id="sessionsGrid">'+list.map(renderSessionCard).join("")+'</div>' : renderSessionsEmptyState())+
    '</section>';
  }

  function renderSessionCard(s){
    var next = nextUpcomingSession();
    var isNext = !!next && next.id===s.id;
    var isPast = !!s.sessionDatetime && s.sessionDatetime < new Date().toISOString();
    return '<div class="talk-card" data-nav="#/sessions/'+esc(s.id)+'" role="button" tabindex="0" aria-label="Voir la session '+esc(s.name||"")+'">'+
      '<div class="mc-top">'+(isNext ? '<span class="pill pill-validee">Prochaine session</span>' : '<span class="theme-tag">Session #'+esc(s.sessionNumber||"—")+'</span>')+(isPast ? ' <span class="pill pill-realisee">Terminée</span>' : '')+'</div>'+
      '<h3>'+esc(s.name||"Session sans nom")+'</h3>'+
      '<div class="meta-row">'+ICONS.calendar+' '+fmtSessionDateTime(s.sessionDatetime)+'</div>'+
      (s.location ? '<div class="meta-row">'+ICONS.pin+' '+esc(s.location)+'</div>' : '')+
    '</div>';
  }

  function renderSessionsEmptyState(){
    return '<div class="empty-state">'+ICONS.empty+'<div>'+(state.adminUnlocked ? "Aucune session pour le moment. Créez la première session CAMUSAT TALK." : "Aucune session n'a encore été annoncée. Revenez bientôt.")+'</div></div>';
  }

  function renderSessionPhotosBlock(s){
    var link = sessionPhotosLink(s);
    if(!link) return "";
    return '<div class="photos-block">'+
      '<div class="photos-block-icon">'+ICONS.camera+'</div>'+
      '<div class="photos-block-text"><h3>Photos de la session</h3><p>Retrouvez-vous et téléchargez vos photos en pleine qualité.</p></div>'+
      '<a class="btn btn-primary" href="'+esc(link)+'" target="_blank" rel="noopener">'+ICONS.download+' Voir et télécharger</a>'+
    '</div>';
  }
