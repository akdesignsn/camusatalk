<!--
  CAMUSAT TALK — application interne de prise de parole (Camusat Sénégal)
  Voir README.md à la racine du dépôt pour le contexte complet.

  Cette version fonctionne de façon autonome (GitHub Pages, ou n'importe quel
  hébergeur statique) : le stockage des propositions passe par Supabase
  (voir SUPABASE_URL / SUPABASE_ANON_KEY dans le script plus bas), pas par les
  capacités d'un Claude Artifact — n'importe qui avec le lien peut proposer un
  sujet, sans compte d'aucune sorte.

  La clé SUPABASE_ANON_KEY ci-dessous est une clé "publishable" : elle est
  conçue pour être publique et visible dans le code d'une page (comme
  n'importe quelle clé côté client), et la vraie protection vient des
  policies de sécurité (RLS) définies sur la table dans Supabase — voir
  README.md pour le détail. Ne remplace jamais cette valeur par une clé
  secrète/"service_role" : celle-ci donnerait un accès total à la base à
  quiconque lit cette page.

  La constante ADMIN_CODE plus bas est, elle, un simple code d'accès
  d'interface pour le Dashboard (pas un mécanisme de sécurité réel) : change-le
  avant toute diffusion large et ne t'en sers pas comme unique protection de
  données sensibles.
-->
<title>CAMUSAT TALK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<meta name="description" content="Programme interne de prise de parole, de partage d'expérience et de développement des compétences chez Camusat Sénégal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#203261;
    --navy-2:#182548;
    --navy-3:#2c4172;
    --navy-tint:#eef1f7;
    --red:#c8102e;
    --red-2:#9c0c22;
    --red-tint:#fdeaec;
    --bg:#f6f7fa;
    --surface:#ffffff;
    --border:#e3e7ee;
    --text:#1b2333;
    --text-muted:#5b6472;
    --text-soft:#848d9c;
    --radius:14px;
    --radius-sm:9px;
    --shadow-sm:0 1px 2px rgba(23,33,63,.06);
    --shadow-md:0 8px 24px -8px rgba(23,33,63,.18);
    --shadow-lg:0 20px 48px -16px rgba(23,33,63,.28);
    --st-attente-bg:#fef3c7; --st-attente-fg:#92400e; --st-attente-bd:#fbdf9a;
    --st-validee-bg:#d9f2ef; --st-validee-fg:#0f5e59; --st-validee-bd:#a9e3db;
    --st-prog-bg:#e6e4fb; --st-prog-fg:#3730a1; --st-prog-bd:#c9c4f5;
    --st-real-bg:#dcfce7; --st-real-fg:#166534; --st-real-bd:#b7ecc8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1524; --surface:#161d33; --border:#2a3455; --text:#e9ecf5; --text-muted:#a8b0c3; --text-soft:#7a8398;
      --navy-tint:#1a2340;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px -8px rgba(0,0,0,.5); --shadow-lg:0 20px 48px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1524; --surface:#161d33; --border:#2a3455; --text:#e9ecf5; --text-muted:#a8b0c3; --text-soft:#7a8398;
    --navy-tint:#1a2340;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px -8px rgba(0,0,0,.5); --shadow-lg:0 20px 48px -16px rgba(0,0,0,.6);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-inline:0;}
  h1,h2,h3,h4,.font-display{font-family:'Sora',system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance;color:var(--text)}
  p{line-height:1.6;color:var(--text-muted)}
  a{color:inherit}
  button{font-family:inherit}
  .wrap{max-width:1180px;margin-inline:auto;padding-inline:24px}
  @media (max-width:640px){.wrap{padding-inline:16px}}

  /* ---------- Nav ---------- */
  .navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;max-width:1180px;margin-inline:auto;padding-inline:24px}
  @media (max-width:640px){.nav-inner{padding-inline:16px}}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
  .brand svg{display:block}
  .brand-word{font-family:'Sora',sans-serif;font-weight:800;font-size:16.5px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
  .brand-word b{color:var(--navy)}
  .brand-word span{color:var(--red)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-word b{color:#c7d3f2} }
  :root[data-theme="dark"] .brand-word b{color:#c7d3f2}
  .navlinks{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .navlink{font-size:14px;font-weight:600;color:var(--text-muted);padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
  .navlink:hover{background:var(--navy-tint);color:var(--navy)}
  .navlink.active{background:var(--navy);color:#fff}
  .nav-toggle{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer}
  @media (max-width:780px){
    .navlinks{position:fixed;inset:0 0 auto 0;top:calc(56px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--border);flex-direction:column;align-items:stretch;padding:10px 16px 16px;gap:6px;display:none;box-shadow:var(--shadow-md)}
    .navlinks.open{display:flex}
    .navlink{width:100%;text-align:left}
    .nav-toggle{display:inline-flex}
  }

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .15s,border-color .15s;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 10px 24px -10px rgba(200,16,46,.55)}
  .btn-primary:hover{background:var(--red-2)}
  .btn-secondary{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
  .btn-secondary:hover{background:rgba(255,255,255,.12)}
  .btn-outline-navy{background:var(--surface);border-color:var(--border);color:var(--navy)}
  .btn-outline-navy:hover{border-color:var(--navy);background:var(--navy-tint)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted);padding:8px 14px}
  .btn-ghost:hover{background:var(--navy-tint);color:var(--navy)}
  .btn-sm{padding:8px 16px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-block{width:100%}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.14) 1px,transparent 1.4px);background-size:26px 26px;opacity:.35;pointer-events:none}
  .hero-inner{position:relative;max-width:1180px;margin-inline:auto;padding:64px 24px 72px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  @media (max-width:900px){.hero-inner{grid-template-columns:1fr;padding:44px 20px 48px;gap:36px}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#cfd8ef;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;margin-bottom:20px;max-width:100%;flex-wrap:wrap;white-space:normal;row-gap:2px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
  .hero h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;color:#fff;line-height:1.08;margin:0 0 14px}
  .hero .slogan{font-family:'Sora',sans-serif;font-weight:600;font-size:19px;color:#ffd8de;margin:0 0 18px}
  .hero p.lead{color:#c6cee2;font-size:16px;max-width:52ch;margin:0 0 30px}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap}
  .hero-stats{display:flex;gap:28px;margin-top:38px;flex-wrap:wrap}
  .hero-stat b{display:block;font-family:'Sora',sans-serif;font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .hero-stat span{font-size:12.5px;color:#aab6d6;letter-spacing:.02em}
  .hero-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:26px;backdrop-filter:blur(6px)}
  .hero-card .mini-card{background:var(--surface);border-radius:var(--radius-sm);padding:16px;color:var(--text);box-shadow:var(--shadow-lg);margin-bottom:12px}
  .hero-card .mini-card:last-child{margin-bottom:0}
  .mini-card .mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .mini-card h4{font-size:14px;margin:0;font-weight:700}
  .mini-card p{font-size:12.5px;margin:2px 0 0;color:var(--text-soft)}
  .mini-card[data-detail]{cursor:pointer;transition:box-shadow .15s,transform .15s}
  .mini-card[data-detail]:hover{box-shadow:0 24px 40px -14px rgba(0,0,0,.35)}
  .mini-card[data-detail]:hover{transform:translateY(-2px)}
  .mini-card[data-detail]:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  /* ---------- Sections ---------- */
  section{padding-block:64px}
  .section-head{max-width:640px;margin-bottom:40px}
  .section-head .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:8px;display:block}
  .section-head h2{font-size:clamp(22px,3vw,30px);margin:0 0 10px}
  .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:860px){.cards-3{grid-template-columns:1fr}}
  .info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm)}
  .info-card .ic-icon{width:42px;height:42px;border-radius:11px;background:var(--navy-tint);color:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .info-card h3{font-size:16.5px;margin:0 0 8px}
  .info-card p{font-size:14px;margin:0}

  /* ---------- Cards / grid (Présentateurs) ---------- */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:26px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select,input,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
  select:focus,input:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,50,97,.12)}
  .field-select{min-width:190px}
  .search-input{min-width:220px}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .talk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;position:relative;transition:box-shadow .15s,transform .15s}
  .talk-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .theme-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--text-muted)}
  .theme-tag .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .talk-card h3{font-size:16.5px;margin:0;line-height:1.35}
  .talk-card .desc{font-size:13.5px;color:var(--text-muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-soft)}
  .meta-row svg{flex-shrink:0;opacity:.7}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
  .demo-badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft);background:var(--navy-tint);padding:3px 8px;border-radius:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .pill-attente{background:var(--st-attente-bg);color:var(--st-attente-fg);border-color:var(--st-attente-bd)}
  .pill-validee{background:var(--st-validee-bg);color:var(--st-validee-fg);border-color:var(--st-validee-bd)}
  .pill-programmee{background:var(--st-prog-bg);color:var(--st-prog-fg);border-color:var(--st-prog-bd)}
  .pill-realisee{background:var(--st-real-bg);color:var(--st-real-fg);border-color:var(--st-real-bd)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-soft)}
  .empty-state svg{margin-bottom:14px;opacity:.5}
  .talk-card{cursor:pointer}
  .talk-card:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

  /* ---------- Detail modal ---------- */
  body.modal-open{overflow:hidden}
  .modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(15,21,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;animation:modal-fade .15s ease}
  .modal-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);max-width:640px;width:100%;margin:auto;position:relative}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:26px 26px 0}
  .modal-close{background:var(--navy-tint);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);flex-shrink:0;transition:background .15s}
  .modal-close:hover{background:var(--border)}
  .modal-body{padding:16px 26px 28px}
  .modal-title{font-size:20px;margin:6px 0 0}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-top:20px}
  @media (max-width:560px){.detail-grid{grid-template-columns:1fr}}
  .detail-item{display:flex;flex-direction:column;gap:3px}
  .detail-item .dt-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft)}
  .detail-item .dt-value{font-size:14px;color:var(--text)}
  .detail-block{font-size:14px;color:var(--text-muted);line-height:1.6;white-space:pre-wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .detail-block h4{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);margin:0 0 8px}
  .detail-block p{margin:0;color:var(--text-muted)}
  @keyframes modal-fade{from{opacity:0}to{opacity:1}}

  /* ---------- Form ---------- */
  .form-shell{max-width:840px;margin-inline:auto}
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md);padding:36px}
  @media (max-width:640px){.form-card{padding:22px}}
  .form-section{margin-bottom:30px}
  .form-section:last-of-type{margin-bottom:0}
  .form-section-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);margin-bottom:16px}
  .form-section-title .num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  .field label{font-size:13px;font-weight:600;color:var(--text)}
  .field label .req{color:var(--red)}
  .field .hint{font-size:12px;color:var(--text-soft)}
  .field .err{font-size:12px;color:var(--red);display:none}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
  .field.invalid .err{display:block}
  textarea{resize:vertical;min-height:84px}
  .divider{height:1px;background:var(--border);margin-block:26px}
  .char-count{font-size:11.5px;color:var(--text-soft);text-align:right}

  /* ---------- Toast ---------- */
  #toast-root{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 32px))}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--navy);box-shadow:var(--shadow-lg);border-radius:12px;padding:14px 16px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:toast-in .2s ease}
  .toast.error{border-left-color:var(--red)}
  .toast b{display:block;margin-bottom:2px;font-size:13.5px}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- Confirmation ---------- */
  .confirm-panel{max-width:560px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md);padding:48px 32px}
  .confirm-icon{width:64px;height:64px;border-radius:50%;background:var(--st-real-bg);color:var(--st-real-fg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .confirm-panel h2{margin:0 0 10px;font-size:22px}
  .confirm-panel p{margin:0 0 26px}
  .confirm-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* ---------- Dashboard ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
  @media (max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr)}}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .stat-tile b{display:block;font-family:'Sora',sans-serif;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat-tile span{font-size:12px;color:var(--text-soft)}
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  table{width:100%;border-collapse:collapse;min-width:920px}
  thead th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-soft);padding:14px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--navy-tint)}
  .cell-name{font-weight:600}
  .cell-sub{font-size:12px;color:var(--text-soft)}
  .mini-select{font-size:12.5px;padding:6px 8px;border-radius:8px}
  .icon-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--text-muted)}
  .icon-btn:hover{background:var(--navy-tint);color:var(--navy)}
  .icon-btn:disabled{opacity:.5;cursor:not-allowed}
  .icon-btn.confirm{background:var(--red-tint);border-color:var(--red);color:var(--red)}

  /* ---------- Sessions ---------- */
  .detail-item.full{grid-column:1/-1}
  .roles-list{display:flex;flex-direction:column;gap:10px;max-width:840px}
  .role-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .role-label{font-size:13.5px;font-weight:700;min-width:230px;flex-shrink:0}
  .role-people{display:flex;gap:8px;flex-wrap:wrap;flex:1;align-items:center}
  .role-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy-tint);color:var(--navy);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px}
  .role-chip-remove{background:none;border:none;padding:0;display:flex;cursor:pointer;color:var(--navy);opacity:.65}
  .role-chip-remove:hover{opacity:1}
  .role-empty{font-size:12.5px;color:var(--text-soft);font-style:italic}
  .role-add-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .role-add-form input{padding:6px 10px;font-size:12.5px;width:170px}
  @media (max-width:640px){.role-row{flex-direction:column;align-items:stretch}.role-label{min-width:0}}

  /* ---------- Bannière prochaine session ---------- */

        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        state.dbAvailable = true;
        fetchAll();
        fetchAllSessions();
        fetchAllAffiches();
        setInterval(function(){ fetchAll(); fetchAllSessions(); fetchAllAffiches(); }, SUPABASE_POLL_MS);
        return;
      }
    }catch(e){ console.warn("Supabase init failed", e); }
    state.items = LOCAL_FALLBACK;
    state.sessions = LOCAL_SESSIONS_FALLBACK;
    state.affiches = LOCAL_AFFICHES_FALLBACK;
    render();
  }

  function fetchAll(){
    if(!sb) return;
    sb.from("propositions").select("*").order("created_at", {ascending:false}).then(function(res){
      if(res.error){ console.warn("Supabase select error", res.error); return; }
      state.items = (res.data||[]).map(fromDbRow);
      // Le rafraîchissement périodique (toutes les 15s) ne doit jamais effacer
      // une saisie en cours : on n'exécute le re-rendu que si personne n'est
      // en train de remplir le formulaire de proposition, ni de modifier un
      // champ du Dashboard. Les données restent à jour en mémoire dans les
      // deux cas ; l'affichage se met à jour dès la prochaine navigation.
      if(currentRoute()==="proposer" || isEditingSomething()) return;
      render();
    });
  }

  function isEditingSomething(){
    var el = document.activeElement;
    if(!el) return false;
    var tag = el.tagName;
    return tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT";
  }

  function createProposition(data, cb){
    data.status = "attente";
    if(sb){
      var row = toDbRow(data);
      row.created_at = new Date().toISOString();
      sb.from("propositions").insert([row]).then(function(res){
        if(res.error){ cb(false, res.error); return; }
        fetchAll();
        cb(true);
      });
    } else {
      data.id = uid();
      data.createdAt = new Date().toISOString();
      LOCAL_FALLBACK.unshift(data);
      state.items = LOCAL_FALLBACK;
      cb(true);
    }
  }

  function updateProposition(id, patch, cb){

        if(res.error){
          toast("Modification impossible", res.error.message || "Réessayez dans un instant.", true);
          if(cb) cb(false, res.error);
          return;
        }
        fetchAll();
        if(cb) cb(true);
      });

      var it = LOCAL_FALLBACK.find(function(x){ return x.id===id; });
      if(it){ Object.assign(it, patch); state.items = LOCAL_FALLBACK; render(); }
      if(cb) cb(true);

      if(idx>-1) LOCAL_FALLBACK.splice(idx,1);

  function uploadAfficheFile(file, cb){
    if(!sb){ cb(false, {message:"Stockage indisponible."}); return; }
    var path = afficheStoragePath(file);
    sb.storage.from("affiches").upload(path, file, {cacheControl:"3600", upsert:false}).then(function(res){
      if(res.error){ cb(false, res.error); return; }
      var pub = sb.storage.from("affiches").getPublicUrl(path);
      cb(true, null, {filePath:path, fileUrl:(pub.data||{}).publicUrl||"", mimeType:file.type||""});
    });
  }

  function removeAfficheFile(path, cb){
    if(!sb || !path){ if(cb) cb(true); return; }
    sb.storage.from("affiches").remove([path]).then(function(res){
      if(cb) cb(!res.error, res.error);
    });
  }

  function createAffiche(file, meta, cb){
    if(!afficheFileValid(file)){
      cb(false, {message:"Format non pris en charge ou fichier trop volumineux (8 Mo max). Formats acceptés : PNG, JPG, PDF."});
      return;
    }
    if(sb){
      uploadAfficheFile(file, function(success, err, up){
        if(!success){ cb(false, err); return; }
        var row = toAfficheDbRow({ title: meta.title, sessionId: meta.sessionId||null, fileUrl: up.fileUrl, filePath: up.filePath, mimeType: up.mimeType });
        row.created_at = new Date().toISOString();
        sb.from("affiches").insert([row]).then(function(res){
          if(res.error){ removeAfficheFile(up.filePath, function(){}); cb(false, res.error); return; }
          fetchAllAffiches();
          cb(true);
        });
      });
    } else {
      var reader = new FileReader();
      reader.onload = function(){
        var it = { id: uid(), title: meta.title, sessionId: meta.sessionId||null, fileUrl: reader.result, filePath:"", mimeType:file.type||"", createdAt: new Date().toISOString() };
        LOCAL_AFFICHES_FALLBACK.unshift(it);
        state.affiches = LOCAL_AFFICHES_FALLBACK;
        cb(true);
      };
      reader.onerror = function(){ cb(false, {message:"Lecture du fichier impossible."}); };
      reader.readAsDataURL(file);
    }
  }

  function updateAffiche(id, patch, cb){
    if(sb){
      sb.from("affiches").update(toAfficheDbRow(patch)).eq("id", id).then(function(res){
        if(res.error){
          toast("Modification impossible", res.error.message || "Réessayez dans un instant.", true);
          if(cb) cb(false, res.error);
          return;
        }
        fetchAllAffiches();
        if(cb) cb(true);
      });
    } else {
      var it = LOCAL_AFFICHES_FALLBACK.find(function(x){ return x.id===id; });
      if(it){ Object.assign(it, patch); state.affiches = LOCAL_AFFICHES_FALLBACK; render(); }
      if(cb) cb(true);
    }
  }

  function replaceAfficheFile(id, file, cb){
    if(!afficheFileValid(file)){
      cb(false, {message:"Format non pris en charge ou fichier trop volumineux (8 Mo max)."});
      return;
    }
    var it = afficheById(id);
    if(sb){
      uploadAfficheFile(file, function(success, err, up){
        if(!success){ cb(false, err); return; }
        sb.from("affiches").update({file_url:up.fileUrl, file_path:up.filePath, mime_type:up.mimeType}).eq("id", id).then(function(res){
          if(res.error){ removeAfficheFile(up.filePath, function(){}); cb(false, res.error); return; }
          if(it && it.filePath) removeAfficheFile(it.filePath, function(){});
          fetchAllAffiches();
          cb(true);
        });
      });
    } else {
      var reader = new FileReader();
      reader.onload = function(){
        if(it){ it.fileUrl = reader.result; it.mimeType = file.type||""; state.affiches = LOCAL_AFFICHES_FALLBACK; render(); }
        cb(true);
      };
      reader.onerror = function(){ cb(false, {message:"Lecture du fichier impossible."}); };
      reader.readAsDataURL(file);
    }
  }

  function deleteAffiche(id, cb){
    var it = afficheById(id);
    if(sb){
      sb.from("affiches").delete().eq("id", id).then(function(res){
        if(res.error){ cb(false, res.error); return; }
        if(it && it.filePath) removeAfficheFile(it.filePath, function(){});
        fetchAllAffiches();
        cb(true);
      });
    } else {
      var idx = LOCAL_AFFICHES_FALLBACK.findIndex(function(x){ return x.id===id; });
      if(idx>-1) LOCAL_AFFICHES_FALLBACK.splice(idx,1);
      state.affiches = LOCAL_AFFICHES_FALLBACK;
      render();
      cb(true);
    }
  }

  /* ============================= ROUTER ============================= */
  function currentRoute(){
    var h = location.hash || "#/";
    if(h.indexOf("#/proposer")===0) return "proposer";
    if(h.indexOf("#/presentateurs")===0) return "presentateurs";
    if(h.indexOf("#/sessions")===0) return "sessions";
    if(h.indexOf("#/affiches")===0) return "affiches";
    if(h.indexOf("#/dashboard")===0) return "dashboard";
    return "accueil";
  }
  function sessionIdFromHash(){
    var m = /^#\/sessions\/(.+)$/.exec(location.hash||"");
    return m ? decodeURIComponent(m[1]) : null;
  }
  function navTo(hash){ location.hash = hash; }

  function updateActiveNav(){
    var route = currentRoute();
    var map = {accueil:"#/", proposer:"#/proposer", presentateurs:"#/presentateurs", sessions:"#/sessions", dashboard:"#/dashboard"};
    document.querySelectorAll(".navlink").forEach(function(el){
      el.classList.toggle("active", el.getAttribute("data-nav")===map[route]);
    });
    document.getElementById("navLinks").classList.remove("open");
  }

  window.addEventListener("hashchange", render);
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-nav]");
    if(t){ navTo(t.getAttribute("data-nav")); }
    var d = e.target.closest("[data-detail]");
    if(d){ openDetailModal(d.getAttribute("data-detail")); }
    var p = e.target.closest("[data-poster]");
    if(p){ openPosterLightbox(p.getAttribute("data-poster")); }
    // Ferme la fenêtre de détail si on clique sur le fond sombre ou sur le
    // bouton de fermeture (mais pas sur son contenu, qui n'a pas cet attribut).
    if(e.target.id==="detailModal" || e.target.closest("[data-modal-close]")){ closeDetailModal(); }
    // Ferme l'affiche en grand format (fond sombre ou bouton de fermeture).
    if(e.target.id==="lightboxOverlay" || e.target.closest("[data-lightbox-close]")){ closePosterLightbox(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      var lightbox = document.getElementById("lightboxOverlay");
      if(lightbox && !lightbox.hidden){ closePosterLightbox(); return; }
      var modal = document.getElementById("detailModal");
      if(modal && !modal.hidden) closeDetailModal();
      return;
    }
    if(e.key==="Enter" || e.key===" "){
      var card = e.target.closest && e.target.closest("[data-detail]");
      if(card){ e.preventDefault(); openDetailModal(card.getAttribute("data-detail")); return; }
      var poster = e.target.closest && e.target.closest("[data-poster]");
      if(poster){ e.preventDefault(); openPosterLightbox(poster.getAttribute("data-poster")); return; }
      var navBtn = e.target.closest && e.target.closest("[data-nav][role='button']");
      if(navBtn){ e.preventDefault(); navTo(navBtn.getAttribute("data-nav")); }
    }
  });

  function field(id,label,type,required,extraClass){
    return '<div class="field'+(extraClass?" "+extraClass:"")+'">'+

  function bindProposerForm(){
    // Le bouton "Proposer un autre sujet" n'existe que sur l'écran de
    // confirmation (donc sans #talkForm à ce moment-là) : on le lie avant le
    // "return" ci-dessous, sinon ce clic ne fait jamais rien.
    var another = document.getElementById("btnAnotherProposal");
    if(another){ another.addEventListener("click", function(){ state.lastSubmitted = null; render(); }); }

    var form = document.getElementById("talkForm");
    if(!form) return;

    var desc = document.getElementById("description");
    var descCount = document.getElementById("descCount");
    if(desc){ desc.addEventListener("input", function(){ descCount.textContent = desc.value.length; }); }

    form.addEventListener("submit", function(e){
      e.preventDefault();
      // Le mentor (mentorName/mentorDept) est facultatif : un présentateur sans
      // mentor identifié peut soumettre son sujet, l'équipe RH lui en assignera
      // un depuis le Dashboard (champ "Mentor" déjà modifiable en ligne).
      var allFields = ["presenterName","presenterRole","presenterEmail","title","description","theme","mentorName","mentorDept","objective","duration","desiredDate"];
      var required = ["presenterName","presenterRole","presenterEmail","title","description","theme","duration","desiredDate"];
      var ok = true;
      var values = {};
      allFields.forEach(function(name){
        var el = document.getElementById(name);
        var fieldWrap = el.closest(".field");
        var val = el.value.trim();
        values[name] = val;
        var isRequired = required.indexOf(name) !== -1;
        var valid = !isRequired || val.length>0;
        if(name==="presenterEmail" && val){ valid = valid && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val); }
        if(name==="desiredDate" && val){ valid = valid && (val >= new Date().toISOString().slice(0,10)); }
        fieldWrap.classList.toggle("invalid", !valid);
        if(!valid) ok = false;
      });
      if(!ok){
        toast("Formulaire incomplet", "Merci de vérifier les champs en rouge.", true);
        var firstInvalid = form.querySelector(".field.invalid input, .field.invalid select, .field.invalid textarea");
        if(firstInvalid) firstInvalid.focus();
        return;
      }
      var submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true; submitBtn.textContent = "Enregistrement…";
      createProposition(values, function(success, err){
        submitBtn.disabled = false; submitBtn.textContent = "Enregistrer ma proposition";
        if(success){
          state.lastSubmitted = values;
          toast("Proposition enregistrée", values.title);
          render();
        } else {
          toast("Erreur d'enregistrement", (err && err.message) || "Merci de réessayer.", true);
        }
      });
    });
  }

  function applyFilters(it){
    if(state.filters.theme && it.theme !== state.filters.theme) return false;
    if(state.filters.status && it.status !== state.filters.status) return false;
    if(state.filters.q){
      var q = state.filters.q.toLowerCase();
      var hay = [it.title,it.presenterName,it.mentorName,it.description].join(" ").toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }

  function bindPresentateursEvents(){
    var ft = document.getElementById("filterTheme");
    var fs = document.getElementById("filterStatus");
    var fq = document.getElementById("filterSearch");
    if(ft) ft.value = state.filters.theme;
    if(fs) fs.value = state.filters.status;
    if(fq) fq.value = state.filters.q;
    function refresh(){
      var filtered = itemsSorted().filter(applyFilters);
      document.getElementById("cardsGrid").innerHTML = filtered.length ? renderCardsGrid(filtered) : renderEmptyState();
      var counter = document.querySelector(".toolbar > div:last-child");
      if(counter) counter.textContent = filtered.length + " sujet(s)";
    }
    if(ft) ft.addEventListener("change", function(){ state.filters.theme = ft.value; refresh(); });
    if(fs) fs.addEventListener("change", function(){ state.filters.status = fs.value; refresh(); });
    if(fq) fq.addEventListener("input", function(){ state.filters.q = fq.value; refresh(); });
  }

      var data = {
        name: document.getElementById("sfName").value.trim(),
        sessionNumber: document.getElementById("sfNumber").value.trim(),
        sessionDatetime: dtVal ? new Date(dtVal).toISOString() : "",
        location: document.getElementById("sfLocation").value.trim(),
        teamsLink: document.getElementById("sfTeamsLink").value.trim(),
        description: document.getElementById("sfDescription").value.trim()
      };
      var required = ["name","sessionNumber","sessionDatetime","location","teamsLink"];
      var missing = required.some(function(k){ return !data[k]; });
      if(missing){
        toast("Champs incomplets", "Merci de remplir tous les champs (seule la description est optionnelle).", true);
        return;
      }
      var btn = document.getElementById("btnSaveSession");
      btn.disabled = true; btn.textContent = "Enregistrement…";
      if(s){
        updateSession(s.id, data, function(success, err){
          if(success){ toast("Session modifiée", data.name); closeDetailModal(); }

      } else {
        createSession(data, function(success, err){
          if(success){ toast("Session créée", data.name); closeDetailModal(); render(); }
          else{ btn.disabled=false; btn.textContent="Créer la session"; toast("Création impossible", (err&&err.message)||"Réessayez.", true); }

  function bindSessionDetailEvents(id){
    var editBtn = document.getElementById("btnEditSession");
    if(editBtn) editBtn.addEventListener("click", function(){ openSessionFormModal(id); });

    document.querySelectorAll(".btn-delete-session").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sid = btn.getAttribute("data-id");
        if(!isSessionDeleteArmed(sid)){
          state.confirmDeleteSessions[sid] = Date.now() + 4000;
          btn.classList.add("confirm");
          btn.title = "Cliquer à nouveau pour confirmer la suppression";
          return;
        }
        delete state.confirmDeleteSessions[sid];
        btn.disabled = true;
        deleteSession(sid, function(success, err){
          if(success){ toast("Session supprimée", ""); navTo("#/sessions"); }
          else{ btn.disabled = false; toast("Suppression impossible", (err && err.message) || "Réessayez.", true); }
        });
      });
    });

    document.querySelectorAll("[data-role-add-open]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.roleAddOpen = id+"::"+btn.getAttribute("data-role-add-open");
        render();
      });
    });
    document.querySelectorAll("[data-role-add-cancel]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.roleAddOpen = null; render(); });
    });
    document.querySelectorAll("[data-role-add]").forEach(function(form){
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var roleId = form.getAttribute("data-role-add");
        var input = form.querySelector("input");
        var name = input.value.trim();
        if(!name) return;
        var s = state.sessions.find(function(x){ return String(x.id)===String(id); });
        if(!s) return;
        var roles = s.roles || emptySessionRoles();
        var roleCfg = SESSION_ROLES.find(function(r){ return r.id===roleId; });
        var current = roles[roleId] || [];
        var updated = (roleCfg && roleCfg.multiple) ? current.concat([name]) : [name];
        var newRoles = Object.assign({}, roles);
        newRoles[roleId] = updated;
        state.roleAddOpen = null;
        updateSession(id, {roles:newRoles}, function(success){
          if(success && roleCfg) toast("Rôle mis à jour", roleCfg.label+" : "+name);
        });
      });
    });
    document.querySelectorAll("[data-remove-role]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var roleId = btn.getAttribute("data-remove-role");
        var idx = parseInt(btn.getAttribute("data-remove-idx"),10);
        var s = state.sessions.find(function(x){ return String(x.id)===String(id); });
        if(!s) return;
        var roles = s.roles || emptySessionRoles();
        var current = (roles[roleId]||[]).slice();
        current.splice(idx,1);
        var newRoles = Object.assign({}, roles);
        newRoles[roleId] = current;
        updateSession(id, {roles:newRoles}, function(success){
          if(success) toast("Personne retirée", "");
        });
      });
    });
  }

      var fileInput = document.getElementById("afFile");

      if(!title){ toast("Titre manquant", "Merci de donner un titre à l'affiche.", true); return; }
      if(!a && !file){ toast("Fichier manquant", "Merci de sélectionner un fichier (PNG, JPG ou PDF).", true); return; }

          else afterSave(true);

      } else {
        createAffiche(file, {title:title, sessionId:sessionId}, afterSave);

      btn.addEventListener("click", function(){ openAfficheFormModal(btn.getAttribute("data-id")); });
    });
    document.querySelectorAll(".btn-delete-affiche").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        if(!isAfficheDeleteArmed(id)){
          state.confirmDeleteAffiches[id] = Date.now() + 4000;
          btn.classList.add("confirm");
          btn.title = "Cliquer à nouveau pour confirmer la suppression";
          return;
        }
        delete state.confirmDeleteAffiches[id];
        btn.disabled = true;
        deleteAffiche(id, function(success, err){
          if(success){ toast("Affiche supprimée", ""); }
          else{ btn.disabled = false; toast("Suppression impossible", (err && err.message) || "Réessayez.", true); }
        });
      });
    });
  }

  function bindTableRowEvents(){
    document.querySelectorAll(".status-select").forEach(function(sel){
      sel.addEventListener("change", function(){
        updateProposition(sel.getAttribute("data-id"), {status: sel.value});
        toast("Statut mis à jour", statusById(sel.value).label);
      });
    });
    document.querySelectorAll(".mentor-input").forEach(function(inp){
      inp.addEventListener("change", function(){
        updateProposition(inp.getAttribute("data-id"), {mentorName: inp.value.trim()});
        toast("Mentor mis à jour", inp.value.trim());
      });
    });
    document.querySelectorAll(".btn-edit").forEach(function(btn){
      btn.addEventListener("click", function(){ openEditModal(btn.getAttribute("data-id")); });
    });
    document.querySelectorAll(".btn-delete").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        if(!isDeleteArmed(id)){
          // Armed state lives in `state`, not just on this DOM node: a re-render
          // triggered between the two clicks (another edit, a background refresh)
          // would otherwise silently disarm the button and strand the user on a
          // third click. isDeleteArmed()/renderDashRows() keep it visually in sync.
          state.confirmDeletes[id] = Date.now() + 4000;
          btn.classList.add("confirm");
          btn.title = "Cliquer à nouveau pour confirmer la suppression";
          return;
        }
        delete state.confirmDeletes[id];
        btn.disabled = true;
        deleteProposition(id, function(success, err){
          if(success){ toast("Proposition supprimée", ""); }
          else{
            btn.disabled = false;
            toast("Suppression impossible", (err && err.message) || "Réessayez.", true);
          }
        });
      });
    });
  }

  /* ---------- exports ---------- */
  function exportRows(){
    return itemsSorted().map(function(it){
      return {
        "Presentateur": it.presenterName||"", "Poste/Departement": it.presenterRole||"", "Email": it.presenterEmail||"",
        "Titre": it.title||"", "Description": it.description||"", "Thematique": themeById(it.theme).label,
        "Mentor": it.mentorName||"", "Departement mentor": it.mentorDept||"", "Objectif": it.objective||"",
        "Duree": it.duration||"", "Date souhaitee": it.desiredDate||"", "Statut": statusById(it.status).label
      };
    });
  }

  function toCsv(rows){
    if(!rows.length) return "";
    var headers = Object.keys(rows[0]);
    var lines = [headers.join(";")];
    rows.forEach(function(r){
      lines.push(headers.map(function(h){
        var v = String(r[h]==null?"":r[h]).replace(/"/g,'""');
        return /[;"\n]/.test(v) ? '"'+v+'"' : v;
      }).join(";"));
    });
    return lines.join("\n");
  }

  function offerDownload(filename, blob){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename; a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
      toast("Export prêt", filename);
    }catch(e){
      toast("Export impossible", e.message || "Réessayez.", true);
    }
  }

  function exportCsv(){
    var csv = "﻿" + toCsv(exportRows());
    offerDownload("camusat-talk-propositions.csv", new Blob([csv], {type:"text/csv;charset=utf-8"}));
  }

  function exportXlsx(){
    if(window.XLSX){ buildAndSaveXlsx(); return; }
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = buildAndSaveXlsx;
    s.onerror = function(){ toast("Export Excel indisponible", "Utilisez l'export CSV.", true); };
    document.head.appendChild(s);
  }

  function buildAndSaveXlsx(){
    try{
      var rows = exportRows();
      var ws = window.XLSX.utils.json_to_sheet(rows);
      var wb = window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb, ws, "Propositions");
      var out = window.XLSX.write(wb, {bookType:"xlsx", type:"array"});
      offerDownload("camusat-talk-propositions.xlsx", new Blob([out], {type:"application/octet-stream"}));
    }catch(e){ toast("Export Excel impossible", e.message, true); }
  }

  /* ============================= BIND PER ROUTE ============================= */
  function bindRouteEvents(route){
    if(route==="proposer") bindProposerForm();
    else if(route==="presentateurs") bindPresentateursEvents();
    else if(route==="sessions") bindSessionsEvents();
    else if(route==="dashboard") bindDashboardEvents();
  }

  /* ============================= INIT ============================= */
  try{ if(sessionStorage.getItem("ct_admin_ok")==="1") state.adminUnlocked = true; }catch(e){}
  state.filters.dashTheme = "";
  initDb();
  render();
})();
</script>
